<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Выбирают не наклейку, а конкретное решение</title>
  <desc id="desc">Название бренда — только начало проверки</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">Выбирают не наклейку, а конкретное решение</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Название бренда — только начало проверки</text>
  <rect x="65" y="170" width="220" height="440" rx="30" fill="url(#panel)" stroke="#C9D5D5" stroke-width="4"/>
          <text x="175" y="230" text-anchor="middle" class="label">Бренд</text><circle cx="175" cy="330" r="52" fill="#EAF7F6" stroke="#C9D5D5" stroke-width="5"/><text x="175" y="345" text-anchor="middle" class="label">1</text>
          <text x="175" y="460" text-anchor="middle" class="note"><tspan x="175" dy="0">Общий уровень</tspan><tspan x="175" dy="28">и репутация</tspan></text><rect x="345" y="170" width="220" height="440" rx="30" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/>
          <text x="455" y="230" text-anchor="middle" class="label">Серия</text><circle cx="455" cy="330" r="52" fill="#EAF7F6" stroke="#11B8B2" stroke-width="5"/><text x="455" y="345" text-anchor="middle" class="label">2</text>
          <text x="455" y="460" text-anchor="middle" class="note"><tspan x="455" dy="0">Конструкция и</tspan><tspan x="455" dy="28">рабочий диапазон</tspan></text><rect x="625" y="170" width="220" height="440" rx="30" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/>
          <text x="735" y="230" text-anchor="middle" class="label">Модель</text><circle cx="735" cy="330" r="52" fill="#EAF7F6" stroke="#11B8B2" stroke-width="5"/><text x="735" y="345" text-anchor="middle" class="label">3</text>
          <text x="735" y="460" text-anchor="middle" class="note"><tspan x="735" dy="0">Мощность, шум</tspan><tspan x="735" dy="28">и функции</tspan></text><rect x="905" y="170" width="220" height="440" rx="30" fill="url(#panel)" stroke="#F2A93B" stroke-width="4"/>
          <text x="1015" y="230" text-anchor="middle" class="label">Сервис</text><circle cx="1015" cy="330" r="52" fill="#EAF7F6" stroke="#F2A93B" stroke-width="5"/><text x="1015" y="345" text-anchor="middle" class="label">4</text>
          <text x="1015" y="460" text-anchor="middle" class="note"><tspan x="1015" dy="0">Монтаж, гарантия</tspan><tspan x="1015" dy="28">и запчасти</tspan></text><path d="M300 390 L330 390" class="line" stroke="#075E63" stroke-width="4"/>
      <path d="M314 378 L330 390 L314 402" class="line" stroke="#075E63" stroke-width="4"/><path d="M580 390 L610 390" class="line" stroke="#075E63" stroke-width="4"/>
      <path d="M594 378 L610 390 L594 402" class="line" stroke="#075E63" stroke-width="4"/><path d="M860 390 L890 390" class="line" stroke="#075E63" stroke-width="4"/>
      <path d="M874 378 L890 390 L874 402" class="line" stroke="#075E63" stroke-width="4"/>
</svg>