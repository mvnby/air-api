<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Безопасный демонтаж — это последовательность</title>
  <desc id="desc">Цель — сохранить оборудование и подготовить его к перевозке или повторному монтажу</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">Безопасный демонтаж — это последовательность</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Цель — сохранить оборудование и подготовить его к перевозке или повторному монтажу</text>
  <rect x="55" y="155" width="220" height="490" rx="30" fill="url(#panel)" stroke="#C9D5D5" stroke-width="4"/>
          <text x="165" y="215" text-anchor="middle" class="label">1. Осмотр</text><circle cx="165" cy="360" r="58" fill="#EAF7F6" stroke="#C9D5D5" stroke-width="6"/><text x="165" y="374" text-anchor="middle" class="label">1</text>
          <text x="165" y="525" text-anchor="middle" class="note">Доступ и состояние</text><path d="M285 400 H320" stroke="#24343A" stroke-width="5"/><path d="M305 388 L320 400 L305 412" fill="none" stroke="#24343A" stroke-width="5"/><rect x="335" y="155" width="220" height="490" rx="30" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/>
          <text x="445" y="215" text-anchor="middle" class="label">2. Хладагент</text><circle cx="445" cy="360" r="58" fill="#EAF7F6" stroke="#11B8B2" stroke-width="6"/><text x="445" y="374" text-anchor="middle" class="label">2</text>
          <text x="445" y="525" text-anchor="middle" class="note">Сохраняют в контуре</text><path d="M565 400 H600" stroke="#24343A" stroke-width="5"/><path d="M585 388 L600 400 L585 412" fill="none" stroke="#24343A" stroke-width="5"/><rect x="615" y="155" width="220" height="490" rx="30" fill="url(#panel)" stroke="#F2A93B" stroke-width="4"/>
          <text x="725" y="215" text-anchor="middle" class="label">3. Соединения</text><circle cx="725" cy="360" r="58" fill="#EAF7F6" stroke="#F2A93B" stroke-width="6"/><text x="725" y="374" text-anchor="middle" class="label">3</text>
          <text x="725" y="525" text-anchor="middle" class="note">Отключают и закрывают</text><path d="M845 400 H880" stroke="#24343A" stroke-width="5"/><path d="M865 388 L880 400 L865 412" fill="none" stroke="#24343A" stroke-width="5"/><rect x="895" y="155" width="220" height="490" rx="30" fill="url(#panel)" stroke="#075E63" stroke-width="4"/>
          <text x="1005" y="215" text-anchor="middle" class="label">4. Блоки</text><circle cx="1005" cy="360" r="58" fill="#EAF7F6" stroke="#075E63" stroke-width="6"/><text x="1005" y="374" text-anchor="middle" class="label">4</text>
          <text x="1005" y="525" text-anchor="middle" class="note">Снимают и упаковывают</text>
</svg>