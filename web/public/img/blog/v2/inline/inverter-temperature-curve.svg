      <circle cx="290" cy="610" r="7" fill="#E56A5D"/><text x="310" y="617" class="note">On/Off: заметные циклы включения и остановки</text>
      <circle cx="725" cy="610" r="7" fill="#11B8B2"/><text x="745" y="617" class="note">Инвертор: плавное удержание</text>
      <text x="1060" y="555" text-anchor="end" class="small">Время →</text>
</svg>