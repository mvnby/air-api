<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Площадь — только начало расчёта</title>
  <desc id="desc">Солнце, люди, техника и кухня добавляют реальную тепловую нагрузку</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">Площадь — только начало расчёта</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Солнце, люди, техника и кухня добавляют реальную тепловую нагрузку</text>
  <rect x="90" y="225" width="260" height="150" rx="26" fill="url(#panel)" stroke="#F2A93B" stroke-width="4"/><text x="220" y="277" text-anchor="middle" class="label">Окна и солнце</text><circle cx="220" cy="328" r="25" fill="none" stroke="#F2A93B" stroke-width="6"/><path d="M220 293 v-15 M185 328 h-15 M255 328 h15" stroke="#F2A93B" stroke-width="5"/><rect x="90" y="485" width="260" height="150" rx="26" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/><text x="220" y="537" text-anchor="middle" class="label">Люди</text><circle cx="200" cy="577" r="16" fill="#11B8B2"/><circle cx="245" cy="577" r="16" fill="#11B8B2"/><path d="M175 620 q25-38 50 0 M220 620 q25-38 50 0" fill="none" stroke="#11B8B2" stroke-width="6"/><rect x="850" y="225" width="260" height="150" rx="26" fill="url(#panel)" stroke="#075E63" stroke-width="4"/><text x="980" y="277" text-anchor="middle" class="label">Техника</text><rect x="932" y="303" width="96" height="58" rx="8" fill="none" stroke="#075E63" stroke-width="6"/><path d="M960 365 h40" stroke="#075E63" stroke-width="6"/><rect x="850" y="485" width="260" height="150" rx="26" fill="url(#panel)" stroke="#E56A5D" stroke-width="4"/><text x="980" y="537" text-anchor="middle" class="label">Кухня</text><path d="M950 620 q-20-30 5-55 q5 30 25 15 q25 24 5 50 M1010 620 q-20-30 5-55 q5 30 25 15 q25 24 5 50" fill="none" stroke="#E56A5D" stroke-width="6"/><path d="M365 300 L465 340" class="line" stroke="#F2A93B" stroke-width="5"/>
      <path d="M449 328 L465 340 L449 352" class="line" stroke="#F2A93B" stroke-width="5"/><path d="M365 555 L465 485" class="line" stroke="#11B8B2" stroke-width="5"/>
      <path d="M449 473 L465 485 L449 497" class="line" stroke="#11B8B2" stroke-width="5"/><path d="M835 300 L735 340" class="line" stroke="#075E63" stroke-width="5"/>
      <path d="M719 328 L735 340 L719 352" class="line" stroke="#075E63" stroke-width="5"/><path d="M835 555 L735 485" class="line" stroke="#E56A5D" stroke-width="5"/>
      <path d="M719 473 L735 485 L719 497" class="line" stroke="#E56A5D" stroke-width="5"/><rect x="475" y="245" width="250" height="340" rx="34" fill="#EAF7F6" stroke="#11B8B2" stroke-width="6"/>
      <text x="600" y="315" text-anchor="middle" class="label">Расчёт мощности</text>
      <rect x="525" y="355" width="150" height="100" rx="14" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="4"/>
      <text x="600" y="415" text-anchor="middle" class="title">м²</text>
      <text x="600" y="505" text-anchor="middle" class="note"><tspan x="600" dy="0">Площадь + все</tspan><tspan x="600" dy="27">дополнительные притоки</tspan></text>
</svg>