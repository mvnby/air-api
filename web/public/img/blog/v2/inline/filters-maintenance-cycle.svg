<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Как ухаживать за сетчатым фильтром</title>
  <desc id="desc">Регулярная простая чистка важнее количества рекламных вставок</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">Как ухаживать за сетчатым фильтром</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Регулярная простая чистка важнее количества рекламных вставок</text>
  <g><rect x="70" y="160" width="220" height="500" rx="28" fill="url(#panel)" stroke="#C9D5D5" stroke-width="3"/>
          <text x="180" y="215" text-anchor="middle" class="label">1. Снять</text><g filter="url(#shadow)">
      <rect x="105" y="285" width="150" height="51" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M123 321 H237" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><rect x="135" y="390" width="90" height="120" rx="10" fill="none" stroke="#075E63" stroke-width="5" stroke-dasharray="8 6"/>
          <text x="180" y="570" text-anchor="middle" class="note"><tspan x="180" dy="0">Открыть крышку</tspan><tspan x="180" dy="27">и вынуть сетку</tspan></text></g><g><rect x="350" y="160" width="220" height="500" rx="28" fill="url(#panel)" stroke="#C9D5D5" stroke-width="3"/>
          <text x="460" y="215" text-anchor="middle" class="label">2. Промыть</text><rect x="420" y="300" width="90" height="130" rx="10" fill="none" stroke="#075E63" stroke-width="5"/><path d="M415 270 q15 25 0 45 q-15-20 0-45 M475 260 q15 25 0 45 q-15-20 0-45 M535 275 q15 25 0 45 q-15-20 0-45" fill="#11B8B2"/>
          <text x="460" y="570" text-anchor="middle" class="note"><tspan x="460" dy="0">Прохладная вода</tspan><tspan x="460" dy="27">без жёсткой щётки</tspan></text></g><g><rect x="630" y="160" width="220" height="500" rx="28" fill="url(#panel)" stroke="#C9D5D5" stroke-width="3"/>
          <text x="740" y="215" text-anchor="middle" class="label">3. Высушить</text><rect x="700" y="320" width="90" height="130" rx="10" fill="none" stroke="#075E63" stroke-width="5"/><circle cx="745" cy="280" r="27" fill="none" stroke="#F2A93B" stroke-width="5"/><path d="M745 235 v-18 M745 343 v-18 M700 280 h-18 M808 280 h-18" stroke="#F2A93B" stroke-width="5"/>
          <text x="740" y="570" text-anchor="middle" class="note"><tspan x="740" dy="0">Без фена</tspan><tspan x="740" dy="27">и прямого солнца</tspan></text></g><g><rect x="910" y="160" width="220" height="500" rx="28" fill="url(#panel)" stroke="#C9D5D5" stroke-width="3"/>
          <text x="1020" y="215" text-anchor="middle" class="label">4. Вернуть</text><g filter="url(#shadow)">
      <rect x="945" y="320" width="150" height="51" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M963 356 H1077" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><path d="M1020 510 V455" stroke="#11B8B2" stroke-width="7"/><path d="M1004 472 l16-17 l16 17" fill="none" stroke="#11B8B2" stroke-width="7"/>
          <text x="1020" y="570" text-anchor="middle" class="note"><tspan x="1020" dy="0">Только полностью</tspan><tspan x="1020" dy="27">сухой фильтр</tspan></text></g><path d="M300 410 L330 410" class="line" stroke="#075E63" stroke-width="4"/>
      <path d="M314 398 L330 410 L314 422" class="line" stroke="#075E63" stroke-width="4"/><path d="M580 410 L610 410" class="line" stroke="#075E63" stroke-width="4"/>
      <path d="M594 398 L610 410 L594 422" class="line" stroke="#075E63" stroke-width="4"/><path d="M860 410 L890 410" class="line" stroke="#075E63" stroke-width="4"/>
      <path d="M874 398 L890 410 L874 422" class="line" stroke="#075E63" stroke-width="4"/>
</svg>