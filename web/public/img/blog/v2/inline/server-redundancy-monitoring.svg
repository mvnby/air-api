<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Охлаждение серверной строят с резервом</title>
  <desc id="desc">Независимый датчик контролирует температуру и переключает блоки</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">Охлаждение серверной строят с резервом</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Независимый датчик контролирует температуру и переключает блоки</text>
  <rect x="55" y="150" width="1090" height="500" rx="34" fill="url(#panel)" stroke="#C9D5D5" stroke-width="3"/>
      <g filter="url(#shadow)">
      <rect x="125" y="245" width="200" height="68" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M143 298 H307" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><g filter="url(#shadow)">
      <rect x="875" y="245" width="200" height="68" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M893 298 H1057" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><rect x="500" y="240" width="200" height="330" rx="22" fill="#EAF7F6" stroke="#075E63" stroke-width="7"/>
      <path d="M535 300 H665 M535 355 H665 M535 410 H665 M535 465 H665" stroke="#075E63" stroke-width="6"/>
      <circle cx="650" cy="300" r="7" fill="#11B8B2"/><circle cx="650" cy="355" r="7" fill="#11B8B2"/><circle cx="650" cy="410" r="7" fill="#11B8B2"/>
      <text x="225" y="220" text-anchor="middle" class="label">Основной</text>
      <text x="975" y="220" text-anchor="middle" class="label">Резервный</text>
      <text x="600" y="610" text-anchor="middle" class="label">Серверная стойка</text>
      <path d="M330 315 C410 330 420 390 485 405" fill="none" stroke="#11B8B2" stroke-width="8" stroke-linecap="round"/>
      <path d="M870 315 C790 330 780 390 715 405" fill="none" stroke="#F2A93B" stroke-width="8" stroke-linecap="round" stroke-dasharray="15 12"/>
      <circle cx="600" cy="185" r="42" fill="#EAF7F6" stroke="#11B8B2" stroke-width="5"/>
      <text x="600" y="195" text-anchor="middle" class="label">°C</text>
      <path d="M600 227 V240 M558 185 H370 V280 M642 185 H830 V280" fill="none" stroke="#075E63" stroke-width="5"/>
      <rect x="470" y="455" width="260" height="75" rx="18" fill="#FFFFFF" stroke="#E56A5D" stroke-width="4"/>
      <text x="600" y="485" text-anchor="middle" class="small">Контроллер: ротация</text>
      <text x="600" y="510" text-anchor="middle" class="small">и аварийное включение</text>
</svg>