<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Тип внутреннего блока выбирают по помещению</title>
  <desc id="desc">Монтажные ограничения и направление воздуха важнее привычной формы корпуса</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">Тип внутреннего блока выбирают по помещению</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Монтажные ограничения и направление воздуха важнее привычной формы корпуса</text>
  <rect x="45" y="150" width="255" height="510" rx="30" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/>
          <text x="172" y="205" text-anchor="middle" class="label">Канальный</text>
          <rect x="107" y="315" width="135" height="72" rx="12" fill="#EAF7F6" stroke="#11B8B2" stroke-width="6"/><path d="M242 338 h42 v-45 h36 M242 365 h42 v45 h36" fill="none" stroke="#11B8B2" stroke-width="6"/><text x="172" y="555" text-anchor="middle" class="note">Скрытый потолок</text><rect x="330" y="150" width="255" height="510" rx="30" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/>
          <text x="457" y="205" text-anchor="middle" class="label">Кассетный</text>
          <rect x="405" y="300" width="120" height="120" rx="16" fill="#EAF7F6" stroke="#11B8B2" stroke-width="6"/><circle cx="465" cy="360" r="30" fill="none" stroke="#11B8B2" stroke-width="6"/><path d="M465 285 v-35 M465 435 v35 M390 360 h-35 M540 360 h35" stroke="#11B8B2" stroke-width="6"/><text x="457" y="555" text-anchor="middle" class="note">Открытый зал</text><rect x="615" y="150" width="255" height="510" rx="30" fill="url(#panel)" stroke="#F2A93B" stroke-width="4"/>
          <text x="742" y="205" text-anchor="middle" class="label">Напольно-</text>
          <rect x="690" y="330" width="145" height="75" rx="18" fill="#FFFFFF" stroke="#F2A93B" stroke-width="6"/><path d="M720 315 q45-55 90 0" fill="none" stroke="#F2A93B" stroke-width="7"/><text x="742" y="555" text-anchor="middle" class="note">Вытянутое помещение</text><rect x="900" y="150" width="255" height="510" rx="30" fill="url(#panel)" stroke="#075E63" stroke-width="4"/>
          <text x="1027" y="205" text-anchor="middle" class="label">Колонный</text>
          <rect x="1000" y="280" width="90" height="180" rx="18" fill="#FFFFFF" stroke="#075E63" stroke-width="6"/><path d="M1018 315 h54 M1018 340 h54" stroke="#24343A" stroke-width="6"/><path d="M1020 270 q25-45 50 0" fill="none" stroke="#075E63" stroke-width="7"/><text x="1027" y="555" text-anchor="middle" class="note">Большой объём</text><text x="742" y="235" text-anchor="middle" class="label">потолочный</text>
</svg>