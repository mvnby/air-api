<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">У одного бренда серии решают разные задачи</title>
  <desc id="desc">Сравнивают конструкцию и режим работы, а не только наклейку на корпусе</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24343A" flood-opacity=".10"/></filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF7F6"/></linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#24343A}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#607277}
      .label{font:700 25px Inter,Arial,sans-serif;fill:#24343A}
      .note{font:500 18px Inter,Arial,sans-serif;fill:#607277}
      .small{font:600 16px Inter,Arial,sans-serif;fill:#24343A}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="40" fill="#F7F5F0"/>
  <text x="600" y="58" text-anchor="middle" class="title">У одного бренда серии решают разные задачи</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Сравнивают конструкцию и режим работы, а не только наклейку на корпусе</text>
  <rect x="55" y="150" width="320" height="510" rx="32" fill="url(#panel)" stroke="#11B8B2" stroke-width="4"/>
          <text x="215" y="205" text-anchor="middle" class="label">Тихая серия</text>
          <g filter="url(#shadow)">
      <rect x="130" y="255" width="170" height="58" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M148 298 H282" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><path d="M210 365 q55 35 5 85 q-65-5-45-65 q8-17 40-20" fill="#EAF7F6" stroke="#11B8B2" stroke-width="6"/>
          <text x="215" y="550" text-anchor="middle" class="note"><tspan x="215" dy="0">Спальня</tspan><tspan x="215" dy="27">низкий шум</tspan></text><rect x="425" y="150" width="320" height="510" rx="32" fill="url(#panel)" stroke="#F2A93B" stroke-width="4"/>
          <text x="585" y="205" text-anchor="middle" class="label">Зимняя серия</text>
          <g filter="url(#shadow)">
      <rect x="500" y="255" width="170" height="58" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M518 298 H652" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><path d="M585 360 v95 M543 384 l84 47 M627 384 l-84 47" stroke="#F2A93B" stroke-width="7" stroke-linecap="round"/>
          <text x="585" y="550" text-anchor="middle" class="note"><tspan x="585" dy="0">Обогрев</tspan><tspan x="585" dy="27">в мороз</tspan></text><rect x="795" y="150" width="320" height="510" rx="32" fill="url(#panel)" stroke="#075E63" stroke-width="4"/>
          <text x="955" y="205" text-anchor="middle" class="label">Коммерческая</text>
          <g filter="url(#shadow)">
      <rect x="870" y="255" width="170" height="58" rx="22" fill="#FFFFFF" stroke="#C9D5D5" stroke-width="3"/>
      <path d="M888 298 H1022" stroke="#24343A" stroke-width="7" stroke-linecap="round"/>
    </g><rect x="900" y="355" width="110" height="100" rx="8" fill="#EAF7F6" stroke="#075E63" stroke-width="6"/><path d="M925 385 h18 M967 385 h18 M925 420 h18 M967 420 h18" stroke="#075E63" stroke-width="7"/>
          <text x="955" y="550" text-anchor="middle" class="note"><tspan x="955" dy="0">Офис</tspan><tspan x="955" dy="27">долгая работа</tspan></text>
</svg>