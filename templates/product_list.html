{% extends "sqladmin/list.html" %}

{% block head %}
{{ super() }}
<style>
    /* Ensure content is not hidden behind sidebar if it is fixed */
    @media (min-width: 992px) {

        /* SQLAdmin used to handle this, but if it fails, we force it. 
           Standard sidebar width in Tabler/SQLAdmin is often ~15rem (240px). */
        .page-body {
            margin-left: 14rem;
        }

        .table-responsive {
            margin-bottom: 0;
            overflow-x: auto;
        }
    }

    .badge {
        font-size: 0.8em;
    }
</style>
{% endblock %}

{% block content_header %}
<div class="row align-items-center mb-3">
    <div class="col">
        <h2 class="page-title">
            {{ model_view.name_plural }}
        </h2>
    </div>
    <div class="col-auto ms-auto d-print-none">
        <div class="d-flex align-items-center">
            <!-- Компактная форма импорта (теперь с поддержкой массового ввода) -->
            <form action="/admin/import_onliner" method="POST" class="d-flex align-items-end me-3">
                <div class="px-2 d-flex flex-column">
                    <textarea name="url" class="form-control form-control-sm"
                        style="width: 300px; height: 32px; resize: none;"
                        placeholder="Один или несколько URL (по одному в строке)..." required
                        onfocus="this.style.height='150px'; this.style.resize='vertical';"
                        onblur="if(this.value=='') { this.style.height='32px'; this.style.resize='none'; }"></textarea>
                    <div class="mt-1">
                        <label class="form-check form-check-inline mb-0" style="cursor: pointer;">
                            <input class="form-check-input" type="checkbox" name="with_related" value="1" checked>
                            <span class="form-check-label small text-muted">Сопутствующие модели</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-sm btn-info text-nowrap">
                    <i class="fa-solid fa-cloud-arrow-down me-1"></i> Импорт
                </button>
            </form>


        </div>
    </div>
</div>
</div>
{% if request.query_params.get('msg') %}
<div class="alert alert-{{ request.query_params.get('type', 'info') }} alert-dismissible" role="alert">
    <div class="d-flex">
        <div>
            {{ request.query_params.get('msg') }}
        </div>
    </div>
    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
</div>
{% endif %}
{% endblock %}
