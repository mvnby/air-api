{% extends "sqladmin/list.html" %}

{% block head %}
{{ super() }}
<style>
    /* Ensure content is not hidden behind sidebar if it is fixed */
    @media (min-width: 992px) {
        .page-body {
            margin-left: 14rem;
        }

        .table-responsive {
            margin-bottom: 0;
            overflow-x: auto;
        }
    }

    .tags__product_title {
        display: flex;
        flex-wrap: wrap;
        gap: .25ch .125ch;
    }

    .badge {
        font-size: 0.8em;
    }
</style>
{% endblock %}

{% block content_header %}
<div class="row align-items-center mb-3">
    <div class="col">
        <h2 class="page-title">
            {{ model_view.name_plural }}
        </h2>
    </div>
    <div class="col-auto ms-auto d-print-none text-end d-flex gap-2">
        <!-- Bulk Tag Button -->
        <button id="bulk-tag-btn" class="btn btn-sm btn-outline-primary mb-2">
            <i class="fa-solid fa-tags me-1"></i> Теги
        </button>

        <details class="d-inline-block text-start">
            <summary class="btn btn-sm btn-outline-secondary mb-2" style="cursor: pointer; list-style: none;">
                <i class="fa-solid fa-cloud-arrow-down me-1"></i> Импорт из Onliner
            </summary>
            <div class="card p-3 shadow-sm" style="position: absolute; right: 0; z-index: 1000; min-width: 350px;">
                <form action="/admin/import_onliner" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Ссылки (одна в строке)</label>
                        <textarea name="url" class="form-control form-control-sm"
                            style="height: 100px; resize: vertical;" placeholder="https://catalog.onliner.by/..."
                            required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-check form-switch cursor-pointer">
                            <input class="form-check-input" type="checkbox" name="with_related" value="1" checked>
                            <span class="form-check-label small">Добавить сопутствующие модели</span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-sm btn-primary w-100">
                        <i class="fa-solid fa-play me-1"></i> Запустить импорт
                    </button>
                </form>
            </div>
        </details>
    </div>
</div>
</div>
{% if request.query_params.get('msg') %}
<div class="alert alert-{{ request.query_params.get('type', 'info') }} alert-dismissible" role="alert">
    <div class="d-flex">
        <div>
            {{ request.query_params.get('msg') }}
        </div>
    </div>
    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
</div>
{% endif %}

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('bulk-tag-btn');
        if (!btn) return;

        btn.addEventListener('click', function () {
            // Find all checked checkboxes with class 'select-box'
            // SQLAdmin structure: <td><input type="hidden" value="ID"><input type="checkbox" class="select-box"></td>
            const checkboxes = document.querySelectorAll('input.select-box:checked');
            const pks = Array.from(checkboxes).map(cb => {
                // Get the ID from the hidden input which is a sibling
                const hiddenId = cb.parentElement.querySelector('input[type="hidden"]');
                return hiddenId ? hiddenId.value : null;
            }).filter(id => id !== null);

            if (pks.length === 0) {
                alert('Выберите товары для редактирования тегов');
                return;
            }

            // Redirect to bulk edit page
            window.location.href = '/admin/bulk-tags?pks=' + pks.join(',');
        });
    });
</script>
{% endblock %}
