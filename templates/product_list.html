{% extends "sqladmin/list.html" %}

{% block content_header %}
<div class="row align-items-center mb-3">
    <div class="col">
        <h2 class="page-title">
            {{ model_view.name_plural }}
        </h2>
    </div>
    <div class="col-auto ms-auto d-print-none">
        <div class="d-flex align-items-center">
            <!-- Компактная форма импорта -->
            <form action="/admin/import_onliner" method="POST" class="d-flex me-3">
                <input type="url" name="url" class="form-control form-control-sm me-2" style="width: 250px;"
                    placeholder="URL с Onliner..." required>
                <button type="submit" class="btn btn-sm btn-info text-nowrap">
                    <i class="fa-solid fa-cloud-arrow-down me-1"></i> Импорт
                </button>
            </form>


        </div>
    </div>
</div>
</div>
{% if request.query_params.get('msg') %}
<div class="alert alert-{{ request.query_params.get('type', 'info') }} alert-dismissible" role="alert">
    <div class="d-flex">
        <div>
            {{ request.query_params.get('msg') }}
        </div>
    </div>
    <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
</div>
{% endif %}
{% endblock %}
