version: '3.8'

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepass}
      POSTGRES_DB: ${POSTGRES_DB:-air_conditioners}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mvnadmin}:${POSTGRES_PASSWORD:-securepass}@db/${POSTGRES_DB:-air_conditioners}
      GOOGLE_TOKEN_FILE: /app/google-oauth/token.json
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./google-oauth:/app/google-oauth

  bot:
    build: .
    restart: always
    depends_on:
      - app
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_API_TOKEN: ${BOT_API_TOKEN:?set BOT_API_TOKEN in .env}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:-http://app:8000/api/internal/bot/v1}
      BOT_API_TIMEOUT_SECONDS: ${BOT_API_TIMEOUT_SECONDS:-5}
      BOT_ENABLED: ${BOT_ENABLED:-true}
      BOT_DROP_PENDING_UPDATES: ${BOT_DROP_PENDING_UPDATES:-false}
      APP_ROLE: ${APP_ROLE:-primary}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://mvn.by}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://mvn.by/api/v1}
      MANAGER_BASE_URL: ${MANAGER_BASE_URL:-}
      BOT_RUNTIME_LEASE_SECONDS: ${BOT_RUNTIME_LEASE_SECONDS:-45}
      BOT_RUNTIME_RENEW_SECONDS: ${BOT_RUNTIME_RENEW_SECONDS:-15}
      BOT_RUNTIME_RETRY_SECONDS: ${BOT_RUNTIME_RETRY_SECONDS:-5}
    command: python -m bot_app.main

volumes:
  postgres_data:
