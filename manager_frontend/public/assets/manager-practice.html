<div id="kitlane-practice" lang="ru">
  <div class="practice-tools">
    <details id="practice-guide"><summary>Сценарии <span id="practice-count">0 / 5</span></summary><div id="practice-goals"></div></details>

  </div>

    <aside class="practice-rail"><div class="practice-brand"><b>K</b><strong>Kitlane</strong></div><nav id="practice-nav" aria-label="Разделы кабинета"></nav></aside>

      <main id="practice-main"></main>

    <div id="practice-overlay" hidden></div>

  <div class="practice-status" role="status" aria-live="polite"></div>

<style>
#kitlane-practice{--paper:light-dark(#fff,#172334);--base:light-dark(#f4f6fa,#111a28);--ink:light-dark(#17273c,#eaf1ff);--muted-ink:light-dark(#55677c,#afbdd2);--line:light-dark(#dbe2eb,#38465b);--blue-ink:light-dark(#224fc4,#a0bdff);--blue-soft:light-dark(#e9efff,#263958);--blue-button:#295bd4;--rail:#13243d;--green-ink:light-dark(#166047,#99dabd);--green-soft:light-dark(#e5f6ed,#223e36);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;min-width:0}
#kitlane-practice *{box-sizing:border-box}
#kitlane-practice [hidden]{display:none!important}
#kitlane-practice button,#kitlane-practice input,#kitlane-practice textarea,#kitlane-practice select{font:inherit}
#kitlane-practice button,#kitlane-practice summary{cursor:pointer}
#kitlane-practice button{border:0;background:transparent;color:inherit}
#kitlane-practice button:disabled{opacity:.5;cursor:default}
#kitlane-practice h1,#kitlane-practice h2,#kitlane-practice h3,#kitlane-practice p{margin:0}
#kitlane-practice h1{font-size:clamp(21px,3vw,30px);line-height:1.17;letter-spacing:-.035em;font-weight:680}
#kitlane-practice h2{font-size:20px;line-height:1.22;font-weight:650}
#kitlane-practice h3{font-size:15px;line-height:1.36;font-weight:650}
#kitlane-practice .practice-tools{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#kitlane-practice .practice-tools details{flex:1;min-width:min(190px,100%)}
#kitlane-practice summary{width:fit-content;padding:7px 1px;font-weight:650}
#practice-count{font-size:12px;color:var(--muted-ink);padding-left:5px}
#practice-goals{display:grid;gap:3px;margin:6px 0 10px}
#kitlane-practice .goal{display:flex;align-items:center;padding:7px 8px;text-align:left;border-radius:6px;gap:8px}
#kitlane-practice .goal:hover{background:var(--blue-soft)}
#kitlane-practice .goal small{margin-left:auto;color:var(--muted-ink)}
#kitlane-practice .practice-devices{display:flex;gap:2px;border:1px solid var(--line);padding:2px;border-radius:8px;background:var(--paper)}
#kitlane-practice .practice-devices button{padding:4px 9px;border-radius:5px;font-size:12px}
#kitlane-practice .practice-devices [aria-pressed=true]{color:var(--blue-ink);background:var(--blue-soft);font-weight:650}
#kitlane-practice .practice-app{position:relative;container-type:inline-size;width:100%;margin-inline:auto;border:1px solid var(--line);border-radius:13px;overflow:clip;background:var(--base);display:grid;grid-template-columns:minmax(155px,22%) minmax(0,1fr);align-items:stretch}
#kitlane-practice .practice-app.phone{max-width:390px;grid-template-columns:minmax(0,1fr)}
#kitlane-practice .practice-rail{padding:18px 10px;color:#e6eefc;background:var(--rail)}
#kitlane-practice .practice-brand{display:flex;gap:11px;align-items:center;margin:2px 8px 24px;font-size:21px;letter-spacing:-.04em}
#kitlane-practice .practice-brand b{display:grid;place-items:center;width:31px;height:33px;border-radius:9px;font-size:21px;font-style:italic;color:white;background:#3b6ee6}
#kitlane-practice .practice-rail nav{display:grid;gap:3px}
#kitlane-practice .nav-item{display:flex;align-items:center;gap:9px;width:100%;min-height:42px;padding:7px 10px;text-align:left;border-radius:6px;font-size:13px}
#kitlane-practice .practice-rail .nav-item[aria-current=page],#kitlane-practice .practice-rail .nav-item:hover{background:#263e61;color:#fff}
#kitlane-practice .practice-rail .nav-item[aria-current=page]{box-shadow:inset 3px 0 #85b0ff}
#kitlane-practice .rail-rule{margin:8px 4px;border-top:1px solid #344661}
#kitlane-practice .practice-body{min-width:0}
#kitlane-practice .practice-header{display:flex;min-height:52px;padding:6px 19px;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;font-weight:580}
#practice-main{display:grid;align-content:start;gap:16px;min-height:390px;padding:24px;min-width:0}
#kitlane-practice .list-top,#kitlane-practice .actions,#kitlane-practice .tags,#kitlane-practice .entry,#kitlane-practice .modal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#kitlane-practice .list-top{justify-content:space-between;align-items:baseline}
#kitlane-practice .lede,#kitlane-practice .dim,#kitlane-practice .entry small{color:var(--muted-ink)}
#kitlane-practice .lede{margin-top:4px;font-size:13px}
#kitlane-practice .dim,#kitlane-practice .entry small{font-size:12px}
#kitlane-practice .cmd,#kitlane-practice .pill,#kitlane-practice .back{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border-radius:7px;padding:7px 11px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:580}
#kitlane-practice .cmd.primary{background:var(--blue-button);border-color:var(--blue-button);color:#fff}
#kitlane-practice .cmd.link,#kitlane-practice .back{color:var(--blue-ink);background:none;border:0;padding-inline:3px;justify-self:start}
#kitlane-practice .pill{min-height:34px;border-radius:20px;font-size:12px}
#kitlane-practice .pill[aria-pressed=true],#kitlane-practice .cmd[aria-pressed=true]{color:var(--blue-ink);border-color:var(--blue-ink);background:var(--blue-soft)}
#kitlane-practice .list,#kitlane-practice .panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
#kitlane-practice .panel{display:grid;gap:12px;padding:16px;min-width:0}
#kitlane-practice .entry{width:100%;text-align:left;padding:12px 14px;justify-content:space-between;min-height:58px;overflow-wrap:anywhere}
#kitlane-practice .entry+.entry{border-top:1px solid var(--line)}
#kitlane-practice button.entry:hover{background:var(--blue-soft)}
#kitlane-practice .entry-body{display:grid;gap:2px;flex:1;min-width:100px}
#kitlane-practice .entry strong{font-weight:620}
#kitlane-practice .queue-card{display:grid;gap:7px;padding:11px 14px}
#kitlane-practice .queue-card+.queue-card{border-top:1px solid var(--line)}
#kitlane-practice .queue-card .entry{padding:0;min-height:40px}
#kitlane-practice .tag{display:inline-flex;border-radius:4px;padding:2px 6px;color:var(--muted-ink);background:var(--base);font-size:11.5px;font-weight:600}
#kitlane-practice .tag.green{color:var(--green-ink);background:var(--green-soft)}
#kitlane-practice .list-caption{margin-bottom:6px;font-weight:620;color:var(--muted-ink);font-size:12px}
#kitlane-practice .field{display:grid;gap:4px;color:var(--muted-ink);font-size:13px;font-weight:580;min-width:0}
#kitlane-practice input,#kitlane-practice textarea,#kitlane-practice select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#kitlane-practice textarea{resize:vertical}
#kitlane-practice .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
#kitlane-practice .pick{display:flex;gap:9px;align-items:center;min-height:52px;padding:8px 13px}
#kitlane-practice .pick+.pick{border-top:1px solid var(--line)}
#kitlane-practice .pick input{width:18px;height:18px}
#kitlane-practice .pick span{min-width:0;flex:1}
#kitlane-practice .pick small{display:block;color:var(--muted-ink)}
#kitlane-practice .dir-links{display:grid;gap:3px}
#kitlane-practice .dir-links button{justify-content:flex-start}
#kitlane-practice .dir-row{display:flex;align-items:center;gap:4px}
#kitlane-practice .dir-row .nav-item{flex:1}
#kitlane-practice .dir-row [aria-pressed=true]{color:var(--blue-ink);background:var(--blue-soft)}
#kitlane-practice .mark{display:inline-grid;place-items:center;width:18px;height:18px;flex:none;font-style:normal;font-size:15px;line-height:1}
#kitlane-practice .mark svg,#kitlane-practice svg.mark{width:17px;height:17px}
#practice-overlay{position:absolute;inset:0;z-index:2;background:rgb(10 24 45 / .43);display:grid;place-items:center;padding:12px}
#kitlane-practice .practice-dialog{width:min(100%,420px);border-radius:12px;padding:17px;display:grid;gap:12px;background:var(--paper);min-width:0;box-shadow:0 15px 40px rgb(0 0 0 / .16)}
#kitlane-practice .modal-head{justify-content:space-between}
#kitlane-practice .practice-status{min-height:22px;padding:4px 1px;color:var(--green-ink);font-size:13px}
#practice-dock{display:none}
#kitlane-practice .practice-app:has(#practice-overlay:not([hidden])){min-height:435px}
@container (max-width:600px){
  #kitlane-practice .practice-rail{display:none}
  #kitlane-practice .practice-body{grid-column:1/-1}
  #kitlane-practice #practice-main{min-height:365px;padding:15px;gap:13px}
  #kitlane-practice .practice-header{padding:6px 13px}
  #kitlane-practice #practice-dock{display:flex;grid-column:1/-1;align-self:end;background:var(--paper);border-top:1px solid var(--line)}
  #kitlane-practice #practice-dock .nav-item{flex:1;min-width:0;flex-direction:column;gap:2px;padding:5px 0;justify-content:center;min-height:48px;font-size:11px}
  #kitlane-practice #practice-dock [aria-current=page]{color:var(--blue-ink);background:var(--blue-soft)}
  #kitlane-practice #practice-overlay{align-items:end;padding:0}
  #kitlane-practice .practice-dialog{width:100%;border-radius:12px 12px 0 0}
  #kitlane-practice .cmd,#kitlane-practice .back,#kitlane-practice .pill{min-height:44px}
  #kitlane-practice input,#kitlane-practice textarea,#kitlane-practice select{font-size:16px}
  #kitlane-practice .pick{flex-wrap:wrap}
}
@media(max-width:620px){#kitlane-practice .practice-devices{display:none}}
@media(prefers-reduced-motion:no-preference){#kitlane-practice .cmd,#kitlane-practice .nav-item{transition:background-color .14s ease}}
</style>
<script>

  const root = document.getElementById('kitlane-practice');
  const get = id => root.querySelector('#practice-' + id);
  const app = get('app'), main = get('main'), overlay = get('overlay');

    { id: 1, name: 'ООО «Северный офис»', person: 'Анна Лис', object: 'Офис на Ясной, 8', tax: '000000101' },

    { id: 701, title: 'Кондиционеры для учебного корпуса', source: 'Тендеры', customer: 2, text: 'Поставка трёх настенных кондиционеров с монтажом. В ведомости указаны помещения и мощность.' },

      data.selection=ev.target.checked?[...new Set([...data.selection,id])]:data.selection.filter(x=>x!==id);
      draw();persist();main.querySelector('[data-pick="'+id+'"]')?.focus({preventScroll:true});
    }
  });
  function save(){
    if(modal==='note' && draft.trim()){
      data.tasks.push({text:draft.trim(),order:draftOrder,due:deadline});data.tasks=data.tasks.slice(-12);
      if(draftOrder===420)mark(2);draft='';deadline='';showTime=false;close();draw();notice('Поручение сохранено');persist();
      get('create').querySelector('button')?.focus({preventScroll:true});
    }
    if(modal==='capture'){
      const text=get('capture').value.trim();if(!text)return;
      data.manual=[...(data.manual||[]),text.slice(0,180)].slice(-5);close();go('inbox');data.filter='Все';draw();notice('Учебное обращение сохранено');persist();
    }
  }
  root.addEventListener('submit',ev=>{ev.preventDefault();save();});
  root.addEventListener('click',async ev=>{
    if(ev.target===overlay){close();return;}
    const b=ev.target.closest('button[data-act]');if(!b||b.disabled)return;
    const a=b.dataset.act,k=b.dataset.key;
    if(trial&&a!=='goal'&&a!=='size')trial.clicks++;
    if(a==='save-note'||a==='save-incoming'){save();return;}
    if(a==='close'){close();return;}
    if(a==='note'){beginNote();return;}
    if(['create','capture','reset'].includes(a)){pop(a);return;}
    if(a==='time'){showTime=!showTime;drawModal();icons();(get('date')||get('text'))?.focus();return;}
    if(a==='pin'){data.pins=data.pins.includes(k)?data.pins.filter(x=>x!==k):[...data.pins,k];drawChrome();get('dirs').innerHTML=directoryRows();icons();get('dirs').querySelector('[data-act=pin][data-key="'+k+'"]')?.focus();persist();return;}
    if(a==='size')data.size=k==='phone'?'phone':'desktop';
    if(a==='goal'){const n=Number(k);trial={n,start:Date.now(),clicks:0};get('guide').open=false;stack=[];modal='';data.filter='Все';data.mode='Подходят';data.arrivedFromInbox=false;data.order=420;data.query='';data.page=goals[n][1];if(n===0)data.converted=data.converted.filter(id=>id!==701);if(n===3){data.offer=[];data.selection=[];}notice(goals[n][0]);}
    if(a==='nav'){if(k==='all'||k==='personal'){pop(k);return;}if(k==='market')data.arrivedFromInbox=false;go(k);}
    if(a==='back')backPage();
    if(a==='filter')data.filter=k;
    if(a==='row'){data.row=Number(k);go('incoming');}
    if(a==='qualify'){data.row=Number(k);go('qualify');}
    if(a==='convert'){if(!data.converted.includes(data.row))data.converted.push(data.row);if(data.row===701)mark(0);data.order=data.row;go('order');notice('Входящее взято в работу');}
    if(a==='order'){data.order=Number(k);go('order');}
    if(a==='monitor'){data.arrivedFromInbox=true;go('market');}
    if(a==='to-inbox'){go('inbox');data.filter='Тендеры';}
    if(a==='mode')data.mode=k;
    if(a==='publication'){go('publication');if(data.mode==='На проверке'&&data.arrivedFromInbox)mark(1);}
    if(a==='evidence')evidence=!evidence;
    if(a==='prepare'&&data.selection.length)go('offer');
    if(a==='publish'){data.offer=[...data.selection];notice('Предложение опубликовано в учебном режиме');}
    if(a==='preview'){go('preview');if(data.offer.length>=2)mark(3);}
    if(a==='copy'){
      const input=get('url');let copied=false;
      try{await navigator.clipboard.writeText(linkForOffer());copied=true;}catch{input.focus();input.select();try{copied=document.execCommand('copy');}catch{}}
      if(copied&&data.offer.length>=2)mark(3);
      drawChrome();icons();notice(copied?'Учебная ссылка скопирована':'Ссылка выделена. Скопируйте её или откройте вид клиента.');persist();return;
    }
    if(a==='client'){data.client=Number(k);go('customer');if(data.client===1)mark(4);}
    if(a==='confirm-reset'){Object.assign(data,initial());delete data.manual;delete data.results;trial=null;stack=[];modal='';draft='';draftOrder=null;deadline='';showTime=false;get('guide').open=false;notice('Учебные данные восстановлены');}
    draw();persist();
  });
  root.addEventListener('keydown',ev=>{
    if(!modal)return;
    if(ev.key==='Escape'){ev.preventDefault();close();return;}
    if(ev.key==='Tab'){const els=[...overlay.querySelectorAll('button:not(:disabled),input,textarea,select')];if(ev.shiftKey&&document.activeElement===els[0]){ev.preventDefault();els.at(-1)?.focus();}else if(!ev.shiftKey&&document.activeElement===els.at(-1)){ev.preventDefault();els[0]?.focus();}}
  });
  if(shared){
    root.querySelector('.practice-tools').hidden=true;
    root.querySelector('.practice-rail').hidden=true;get('dock').hidden=true;
    get('create').hidden=true;root.querySelector('.practice-body').style.gridColumn='1 / -1';
    draw();main.querySelector('.back')?.remove();return;
  }
  window.addEventListener('openai:set_globals',ev=>{const v=ev.detail?.globals?.widgetState?.privateContent;if(v&&JSON.stringify(v)!==lastSaved){restore(v);draw();}});
  draw();
})();
</script>

</body>
</html>
