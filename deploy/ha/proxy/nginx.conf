user nginx;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    # Personal offer URLs carry a bearer token. Match the normalized URI.
    map $uri $mvn_log_api_request {
        ~^/api/v1/personal-offers(?:/|$) 0;
        default 1;
    }

    access_log /var/log/nginx/access.log combined if=$mvn_log_api_request;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 20m;
    proxy_read_timeout 60s;

    server {
        listen 8000;
        server_name _;
        proxy_set_header Host api.mvn.by;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location / {
            include /etc/nginx/mvn-proxy/upstream.conf;
        }

        location ^~ /api/v1/personal-offers/ {
            error_log /dev/null emerg;
            proxy_cache off;
            include /etc/nginx/mvn-proxy/upstream.conf;
        }
    }
}
