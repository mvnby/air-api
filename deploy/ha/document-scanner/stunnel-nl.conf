foreground = yes
pid =
debug = warning

[document-scanner]
accept = 10.77.0.2:3311
connect = /run/mvn-document-scanner/clamd.sock
cert = /etc/mvn-document-scanner/tls/local.pem
key = /etc/mvn-document-scanner/tls/local.key
CAfile = /etc/mvn-document-scanner/tls/peer.pem
verifyPeer = yes
sslVersionMin = TLSv1.3
TIMEOUTidle = 15
