foreground = yes
pid =
debug = warning

[document-scanner]
client = yes
accept = /run/mvn-document-scanner/clamd.sock
connect = 10.77.0.2:3311
local = 10.77.0.1
cert = /etc/mvn-document-scanner/tls/local.pem
key = /etc/mvn-document-scanner/tls/local.key
CAfile = /etc/mvn-document-scanner/tls/peer.pem
verifyPeer = yes
sslVersionMin = TLSv1.3
TIMEOUTconnect = 4
TIMEOUTidle = 15
