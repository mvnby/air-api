Foreground yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 3
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 0660
StreamMaxLength 10M
AlertExceedsMax yes
MaxThreads 2
MaxQueue 8
ConcurrentDatabaseReload yes
SelfCheck 300
EnableShutdownCommand no
EnableReloadCommand no
