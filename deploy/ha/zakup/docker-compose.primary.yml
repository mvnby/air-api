name: mvn_reserve

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f}
    restart: unless-stopped
    shm_size: 128mb
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=100
      - -c
      - wal_keep_size=512MB
      - -c
      - "archive_mode=${POSTGRES_PITR_ARCHIVE_MODE:-off}"
      - -c
      - "archive_timeout=${POSTGRES_PITR_ARCHIVE_TIMEOUT:-0}"
      - -c
      - >-
        archive_command=sh -ec 'src="$$1"; dst="/postgres-wal-archive/$$2"; tmp="$${dst}.tmp.$$$$"; cleanup(){ rm -f "$$tmp"; }; trap cleanup EXIT HUP INT TERM; umask 077; cp "$$src" "$$tmp"; sync; if ln "$$tmp" "$$dst" 2>/dev/null; then sync; exit 0; fi; cmp -s "$$src" "$$dst"' sh "%p" "%f"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-air_conditioners}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-air_conditioners}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "10.77.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-wal-archive:/postgres-wal-archive
    mem_limit: ${MVN_RESERVE_DB_MEMORY:-220m}
    networks:
      - reserve

  app:
    image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${MVN_RESERVE_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      APP_ROLE: primary
      SCHEDULER_ENABLED: "true"
      BOT_ENABLED: "false"
      API_READY_ENABLED: "true"
      DB_BOOTSTRAP_ENABLED: "true"
      MAIL_IMAP_AUTO_IMPORT_ENABLED: "true"
      MAIL_IMAP_LEAD_AUTO_IMPORT_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-air_conditioners}
      BACKGROUND_REMOVAL_PROVIDER: noop
      BACKGROUND_REMOVAL_REMBG_PRELOAD_MODELS: ""
      BACKGROUND_REMOVAL_PROCESS_MAX_MEMORY_MB: "384"
      BACKGROUND_REMOVAL_PROCESS_MAX_CPU_SECONDS: "45"
      GOOGLE_TOKEN_FILE: /app/google-oauth/token.json
    ports:
      - "127.0.0.1:${MVN_RESERVE_APP_PORT:-18000}:8000"
    volumes:
      - ./media:/app/media
      - ./model-cache/u2net:/root/.u2net
      - ./google-oauth:/app/google-oauth
      - ./secrets/client_secret.json:/app/client_secret.json:ro
      - ./secrets/credentials.json:/app/credentials.json:ro
      - ./secrets/g-vision-ocr.json:/app/g-vision-ocr.json:ro
    mem_limit: ${MVN_RESERVE_APP_MEMORY:-1024m}
    networks:
      - reserve

  bot:
    profiles: [legacy-bot]
    image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_API_TOKEN: ${BOT_API_TOKEN:?set BOT_API_TOKEN in .env}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:?set stable HTTPS BOT_API_BASE_URL in .env}
      BOT_API_TIMEOUT_SECONDS: ${BOT_API_TIMEOUT_SECONDS:-5}
      BOT_DROP_PENDING_UPDATES: ${BOT_DROP_PENDING_UPDATES:-false}
      ENVIRONMENT: production
      APP_ROLE: primary
      BOT_ENABLED: ${LEGACY_BOT_ENABLED:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://mvn.by}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://mvn.by/api/v1}
      MANAGER_BASE_URL: ${MANAGER_BASE_URL:-}
      BOT_RUNTIME_LEASE_SECONDS: ${BOT_RUNTIME_LEASE_SECONDS:-45}
      BOT_RUNTIME_RENEW_SECONDS: ${BOT_RUNTIME_RENEW_SECONDS:-15}
      BOT_RUNTIME_RETRY_SECONDS: ${BOT_RUNTIME_RETRY_SECONDS:-5}
    command: python -m bot_app.main
    mem_limit: ${MVN_RESERVE_BOT_MEMORY:-360m}
    networks:
      - reserve

volumes:
  postgres_data:

networks:
  reserve:
    driver: bridge
