services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f}
    restart: always
    command:
      - postgres
      - -c
      - wal_keep_size=512MB
      - -c
      - "archive_mode=${POSTGRES_PITR_ARCHIVE_MODE:-off}"
      - -c
      - "archive_timeout=${POSTGRES_PITR_ARCHIVE_TIMEOUT:-0}"
      - -c
      - "archive_command=test ! -f /postgres-wal-archive/%f && cp %p /postgres-wal-archive/%f || test -f /postgres-wal-archive/%f"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
      - "10.77.0.2:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-wal-archive:/postgres-wal-archive

  app:
    image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      APP_ROLE: primary
      SCHEDULER_ENABLED: "true"
      BOT_ENABLED: "false"
      API_READY_ENABLED: "true"
      DB_BOOTSTRAP_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
      - ./postgres-wal-archive:/postgres-wal-archive
      - ./model-cache/u2net:/root/.u2net
      - ./token.json:/app/token.json
      - ./client_secret.json:/app/client_secret.json
      - ./credentials.json:/app/credentials.json
      - ./g-vision-ocr.json:/app/g-vision-ocr.json:ro

  bot:
    image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      APP_ROLE: primary
      SCHEDULER_ENABLED: "false"
      BOT_ENABLED: "true"
      DB_BOOTSTRAP_ENABLED: "false"
    volumes:
      - ./media:/app/media
      - ./g-vision-ocr.json:/app/g-vision-ocr.json:ro
    command: python -m bot_app.main

volumes:
  postgres_data:
