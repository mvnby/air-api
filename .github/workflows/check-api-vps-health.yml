name: API VPS Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check mode"
        type: choice
        required: true
        default: "public-only"
        options:
          - public-only
          - ssh
      backup_max_age_hours:
        description: "Backup freshness threshold in hours"
        type: string
        required: false
        default: "36"
      check_backups:
        description: "Check Google Drive backup freshness in ssh mode"
        type: boolean
        required: false
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup API SSH Key
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'ssh' }}
        env:
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST_API}" ] || [ -z "${SSH_USER_API}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing one of required secrets for ssh mode: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/api_vps_health_key
          chmod 600 ~/.ssh/api_vps_health_key
          for host in "${PATRONI_MVN_API_HOST}" "${PATRONI_ZAKUP_HOST}"; do
            ssh-keyscan -T 10 -H "${host}" >> ~/.ssh/known_hosts
          done

      - name: Detect official Patroni maintenance
        id: maintenance
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'ssh') && (vars.API_DB_HA_MODE || 'physical') == 'patroni' }}
        env:
          API_SSH_USER: ${{ secrets.SSH_USER_API }}
          API_STANDBY_USER: ${{ vars.API_STANDBY_USER || secrets.SSH_USER_API }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
        run: |
          set -euo pipefail
          export SSH_OPTS="-i ${HOME}/.ssh/api_vps_health_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          export API_NODE_SSH="${API_SSH_USER}@${PATRONI_MVN_API_HOST}"
          export RESERVE_NODE_SSH="${API_STANDBY_USER}@${PATRONI_ZAKUP_HOST}"
          export API_NODE_PROJECT_DIR="/opt/air-api"
          export RESERVE_NODE_PROJECT_DIR="/opt/mvn-reserve"
          python3 scripts/ha/check_patroni_maintenance.py \
            --github-output "${GITHUB_OUTPUT}" 2>&1 | tee api-vps-health.log

      - name: Run API VPS Health Check
        if: steps.maintenance.outputs.active != 'true'
        env:
          BASE_URL: https://api.mvn.by
          API_DB_HA_MODE: ${{ vars.API_DB_HA_MODE || 'physical' }}
          BACKUP_MAX_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_max_age_hours || '36' }}
          CHECK_BACKUPS: ${{ github.event_name != 'workflow_dispatch' || inputs.check_backups }}
          SKIP_PUBLIC_CHECKS: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'ssh' }}
          API_SSH_HOST: ${{ secrets.SSH_HOST_API }}
          API_SSH_USER: ${{ secrets.SSH_USER_API }}
          API_STANDBY_HOST: ${{ vars.API_STANDBY_HOST || '193.47.42.213' }}
          API_STANDBY_USER: ${{ vars.API_STANDBY_USER || secrets.SSH_USER_API }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
          API_PROJECT_DIR: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}
          API_COMPOSE_FILE: ${{ vars.API_COMPOSE_FILE || 'docker-compose.prod.yml' }}
          API_STANDBY_PROJECT_DIR: ${{ vars.API_STANDBY_PROJECT_DIR || '/opt/mvn-reserve' }}
          API_STANDBY_COMPOSE_FILE: ${{ vars.API_STANDBY_COMPOSE_FILE || 'docker-compose.reserve.yml' }}
          API_COMPOSE_SERVICE_CHECKS: ${{ vars.API_COMPOSE_SERVICE_CHECKS || vars.API_SMOKE_COMPOSE_SERVICE_CHECKS || 'app db' }}
          API_LOCAL_HEALTH_URL: ${{ vars.API_LOCAL_HEALTH_URL || 'http://127.0.0.1:18080/api/health' }}
        run: |
          set -euo pipefail

          mode="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'ssh' }}"
          if [ "${mode}" = "public-only" ]; then
            bash scripts/check_api_vps_health.sh --public-only | tee -a api-vps-health.log
          else
            target_host="${API_SSH_HOST}"
            target_user="${API_SSH_USER}"
            target_project_dir="${API_PROJECT_DIR}"
            target_compose_file="${API_COMPOSE_FILE}"
            if [ "${API_DB_HA_MODE}" = "patroni" ]; then
              export SSH_OPTS="-i ${HOME}/.ssh/api_vps_health_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
              primary_label="$(
                API_NODE_SSH="${API_SSH_USER}@${PATRONI_MVN_API_HOST}" \
                  RESERVE_NODE_SSH="${API_STANDBY_USER}@${PATRONI_ZAKUP_HOST}" \
                  API_NODE_PROJECT_DIR="/opt/air-api" \
                  RESERVE_NODE_PROJECT_DIR="/opt/mvn-reserve" \
                  API_NODE_COMPOSE_FILE="docker-compose.patroni.yml" \
                  RESERVE_NODE_COMPOSE_FILE="docker-compose.patroni.yml" \
                  python3 scripts/ha/check_patroni_production.py --resolve-primary
              )"
              if [ "${primary_label}" = "api" ]; then
                target_host="${PATRONI_MVN_API_HOST}"
                target_user="${API_SSH_USER}"
                target_project_dir="/opt/air-api"
                target_compose_file="docker-compose.patroni.yml"
                API_LOCAL_HEALTH_URL="http://127.0.0.1:18080/api/health"
              elif [ "${primary_label}" = "reserve" ]; then
                target_host="${PATRONI_ZAKUP_HOST}"
                target_user="${API_STANDBY_USER}"
                target_project_dir="/opt/mvn-reserve"
                target_compose_file="docker-compose.patroni.yml"
                API_LOCAL_HEALTH_URL="http://127.0.0.1:18000/api/health"
              else
                echo "::error::Unexpected Patroni primary label: ${primary_label:-empty}"
                exit 1
              fi
            elif [ "${API_DB_HA_MODE}" != "physical" ]; then
              echo "::error::API_DB_HA_MODE must be physical or patroni"
              exit 1
            fi

            API_SSH_HOST="${target_host}" \
              API_SSH_USER="${target_user}" \
              API_PROJECT_DIR="${target_project_dir}" \
              API_COMPOSE_FILE="${target_compose_file}" \
              API_LOCAL_HEALTH_URL="${API_LOCAL_HEALTH_URL}" \
              API_SSH_KEY_PATH="${HOME}/.ssh/api_vps_health_key" \
              bash scripts/check_api_vps_health.sh | tee -a api-vps-health.log
          fi

      - name: Write Summary
        if: always()
        run: |
          {
            echo "## API VPS Health Check"
            echo "- trigger: ${{ github.event_name }}"
            echo "- mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'ssh' }}"
            echo "- base_url: https://api.mvn.by"
            echo "- api_project_dir: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}"
            echo "- api_compose_file: ${{ vars.API_COMPOSE_FILE || 'docker-compose.prod.yml' }}"
            echo "- api_compose_service_checks: ${{ vars.API_COMPOSE_SERVICE_CHECKS || vars.API_SMOKE_COMPOSE_SERVICE_CHECKS || 'app db' }}"
            echo "- api_local_health_url: ${{ vars.API_LOCAL_HEALTH_URL || 'http://127.0.0.1:18080/api/health' }}"
            echo "- backup_max_age_hours: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_max_age_hours || '36' }}"
            echo "- check_backups: ${{ github.event_name != 'workflow_dispatch' || inputs.check_backups }}"
            echo "- skip_public_checks: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'ssh' }}"
            echo "- official_maintenance: ${{ steps.maintenance.outputs.active || 'false' }}"
            echo "- log_artifact: api-vps-health-log-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Health Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-vps-health-log-${{ github.run_id }}
          path: api-vps-health.log
          if-no-files-found: warn

      - name: Notify HA failure
        if: failure()
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "MVN API VPS health check failed"
          details: "Artifact: api-vps-health-log-${{ github.run_id }}"
