name: Deploy Web Shadow Runtime

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to build on the web VPS. Defaults to this workflow run SHA."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Print the VPS commands without changing runtime state."
        type: boolean
        required: false
        default: true
      run_local_smoke:
        description: "Run localhost runtime smoke on the web VPS."
        type: boolean
        required: false
        default: true
      run_shadow_host_smoke:
        description: "Run protected nginx shadow host smoke. Requires nginx route and WEB_SHADOW_BASIC_AUTH."
        type: boolean
        required: false
        default: false
      run_public_static_smoke:
        description: "Verify public static mvn.by after shadow deploy."
        type: boolean
        required: false
        default: true
      shadow_host_header:
        description: "Host header for origin-only shadow smoke."
        type: string
        required: false
        default: "shadow-web.mvn.by"
      shadow_public_base_url:
        description: "Protected shadow base URL. Use http://127.0.0.1 for origin-only smoke or https://shadow-web.mvn.by after approved DNS."
        type: string
        required: false
        default: "http://127.0.0.1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: deploy_sha
        run: |
          set -euo pipefail
          requested="${{ inputs.commit_sha }}"
          if [ -z "${requested}" ]; then
            requested="${GITHUB_SHA}"
          fi
          sha="$(git rev-parse --verify "${requested}^{commit}")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Web Shadow Runtime Deploy"
            echo "- requested_sha: ${requested}"
            echo "- resolved_sha: ${sha}"
            echo "- dry_run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH Key for Web Server
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "${{ secrets.SSH_HOST_WEB }}" >> ~/.ssh/known_hosts || true

      - name: Send Bounded Shadow Deploy Command
        env:
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_LOCAL_SMOKE: ${{ inputs.run_local_smoke }}
          RUN_SHADOW_HOST_SMOKE: ${{ inputs.run_shadow_host_smoke }}
          RUN_PUBLIC_STATIC_SMOKE: ${{ inputs.run_public_static_smoke }}
          SHADOW_HOST_HEADER: ${{ inputs.shadow_host_header }}
          SHADOW_PUBLIC_BASE_URL: ${{ inputs.shadow_public_base_url }}
          SHADOW_BASIC_AUTH: ${{ secrets.WEB_SHADOW_BASIC_AUTH }}
          SSH_HOST_WEB: ${{ secrets.SSH_HOST_WEB }}
          SSH_USER_WEB: ${{ secrets.SSH_USER_WEB }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST_WEB}" ] || [ -z "${SSH_USER_WEB}" ]; then
            echo "::error::Missing SSH_HOST_WEB or SSH_USER_WEB secret."
            exit 1
          fi

          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          remote_env=(
            "DEPLOY_SHA=${DEPLOY_SHA}"
            "DRY_RUN=${DRY_RUN}"
            "RUN_LOCAL_SMOKE=${RUN_LOCAL_SMOKE}"
            "RUN_SHADOW_HOST_SMOKE=${RUN_SHADOW_HOST_SMOKE}"
            "RUN_PUBLIC_STATIC_SMOKE=${RUN_PUBLIC_STATIC_SMOKE}"
            "SHADOW_HOST_HEADER=${SHADOW_HOST_HEADER}"
            "SHADOW_PUBLIC_BASE_URL=${SHADOW_PUBLIC_BASE_URL}"
            "SHADOW_BASIC_AUTH=${SHADOW_BASIC_AUTH}"
          )
          remote_prefix=""
          for item in "${remote_env[@]}"; do
            remote_prefix+=" $(printf '%q' "$item")"
          done

          cat scripts/deploy_web_shadow.sh | ssh ${SSH_OPTS} "${SSH_USER_WEB}@${SSH_HOST_WEB}" "cat > /tmp/deploy_web_shadow.sh"
          ssh ${SSH_OPTS} "${SSH_USER_WEB}@${SSH_HOST_WEB}" "chmod +x /tmp/deploy_web_shadow.sh && env${remote_prefix} bash /tmp/deploy_web_shadow.sh" | tee web_shadow_deploy.log

      - name: Upload Shadow Deploy Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-shadow-deploy-${{ github.run_id }}
          path: web_shadow_deploy.log
          if-no-files-found: warn

      - name: Shadow Deploy Summary
        if: always()
        run: |
          {
            echo "## Web Shadow Runtime Deploy Result"
            echo "- deploy_sha: ${{ steps.deploy_sha.outputs.sha }}"
            echo "- dry_run: ${{ inputs.dry_run }}"
            echo "- shadow_service: web-public-shadow"
            echo "- localhost_bind: 127.0.0.1:4322"
            echo "- public_cutover: false"
            echo "- static_deploy_changed: false"
            echo "- log_artifact: web-shadow-deploy-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
