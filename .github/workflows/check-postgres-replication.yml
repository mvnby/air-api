name: PostgreSQL Replication Check

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      max_replay_lag_bytes:
        description: "Max allowed primary-to-standby replay lag in bytes"
        type: string
        required: false
        default: "1048576"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: postgres-replication-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup API SSH Key
        env:
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST_API}" ] || [ -z "${SSH_USER_API}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing one of required secrets: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/postgres_replication_key
          chmod 600 ~/.ssh/postgres_replication_key
          ssh-keyscan -T 10 -H "${PATRONI_MVN_API_HOST}" >> ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "${PATRONI_ZAKUP_HOST}" >> ~/.ssh/known_hosts

      - name: Detect official Patroni maintenance
        id: maintenance
        if: ${{ (vars.API_DB_HA_MODE || 'physical') == 'patroni' }}
        env:
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          API_STANDBY_USER: ${{ vars.API_STANDBY_USER || secrets.SSH_USER_API }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
        run: |
          set -euo pipefail
          export SSH_OPTS="-i ~/.ssh/postgres_replication_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          export API_NODE_SSH="${SSH_USER_API}@${PATRONI_MVN_API_HOST}"
          export RESERVE_NODE_SSH="${API_STANDBY_USER}@${PATRONI_ZAKUP_HOST}"
          export API_NODE_PROJECT_DIR="/opt/air-api"
          export RESERVE_NODE_PROJECT_DIR="/opt/mvn-reserve"
          python3 scripts/ha/check_patroni_maintenance.py \
            --github-output "${GITHUB_OUTPUT}" 2>&1 | tee postgres-replication-check.log

      - name: Run PostgreSQL replication check
        if: steps.maintenance.outputs.active != 'true'
        env:
          API_DB_HA_MODE: ${{ vars.API_DB_HA_MODE || 'physical' }}
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          API_STANDBY_HOST: ${{ vars.API_STANDBY_HOST || '193.47.42.213' }}
          API_STANDBY_USER: ${{ vars.API_STANDBY_USER || secrets.SSH_USER_API }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
          PRIMARY_PROJECT_DIR: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}
          PRIMARY_COMPOSE_FILE: ${{ vars.API_COMPOSE_FILE || 'docker-compose.prod.yml' }}
          STANDBY_PROJECT_DIR: ${{ vars.API_STANDBY_PROJECT_DIR || '/opt/mvn-reserve' }}
          STANDBY_COMPOSE_FILE: ${{ vars.API_STANDBY_COMPOSE_FILE || 'docker-compose.reserve.yml' }}
          PATRONI_API_PROJECT_DIR: /opt/air-api
          PATRONI_RESERVE_PROJECT_DIR: /opt/mvn-reserve
          EXPECTED_SLOT: ${{ vars.POSTGRES_STANDBY_SLOT || 'zakup_standby' }}
          EXPECTED_PRIMARY_WG_IP: ${{ vars.POSTGRES_PRIMARY_WG_IP || '10.77.0.2' }}
          EXPECTED_STANDBY_WG_IP: ${{ vars.POSTGRES_STANDBY_WG_IP || '10.77.0.1' }}
          MAX_REPLAY_LAG_BYTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_replay_lag_bytes || vars.POSTGRES_REPLICATION_MAX_LAG_BYTES || '1048576' }}
        run: |
          set -euo pipefail
          export SSH_OPTS="-i ~/.ssh/postgres_replication_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          case "${API_DB_HA_MODE}" in
            patroni)
              export API_NODE_SSH="${SSH_USER_API}@${PATRONI_MVN_API_HOST}"
              export RESERVE_NODE_SSH="${API_STANDBY_USER}@${PATRONI_ZAKUP_HOST}"
              export API_NODE_PROJECT_DIR="${PATRONI_API_PROJECT_DIR}"
              export RESERVE_NODE_PROJECT_DIR="${PATRONI_RESERVE_PROJECT_DIR}"
              export API_NODE_COMPOSE_FILE=docker-compose.patroni.yml
              export RESERVE_NODE_COMPOSE_FILE=docker-compose.patroni.yml
              export API_NODE_WG_IP="${EXPECTED_PRIMARY_WG_IP}"
              export RESERVE_NODE_WG_IP="${EXPECTED_STANDBY_WG_IP}"
              python3 scripts/ha/check_patroni_production.py \
                --snapshot-output postgres-ha-snapshot.json \
                | tee -a postgres-replication-check.log
              ;;
            physical)
              export PRIMARY_SSH="${SSH_USER_API}@${SSH_HOST_API}"
              export STANDBY_SSH="${API_STANDBY_USER}@${API_STANDBY_HOST}"
              bash scripts/ha/check_postgres_replication.sh | tee -a postgres-replication-check.log
              ;;
            *)
              echo "::error::API_DB_HA_MODE must be physical or patroni"
              exit 1
              ;;
          esac

      - name: Restore previous HA notification state
        id: previous-state
        if: ${{ always() && (vars.API_DB_HA_MODE || 'physical') == 'patroni' && steps.maintenance.outputs.active != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_dir="${RUNNER_TEMP}/ha-notification-previous"
          mkdir -p "${previous_dir}"
          restored=false
          while IFS= read -r previous_run_id; do
            if gh run download "${previous_run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "ha-notification-state-${previous_run_id}" \
              --dir "${previous_dir}" 2>/dev/null; then
              restored=true
              break
            fi
          done < <(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow check-postgres-replication.yml \
              --branch main \
              --status completed \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          echo "restored=${restored}" >> "${GITHUB_OUTPUT}"

      - name: Classify owner-facing HA event
        id: ha-event
        if: ${{ always() && (vars.API_DB_HA_MODE || 'physical') == 'patroni' && steps.maintenance.outputs.active != 'true' }}
        run: |
          set -euo pipefail
          python3 scripts/ha/ha_telegram_events.py \
            --snapshot postgres-ha-snapshot.json \
            --previous-state "${RUNNER_TEMP}/ha-notification-previous/ha-notification-state.json" \
            --fallback-log postgres-replication-check.log \
            --state-output ha-notification-state.json \
            --message-output ha-owner-message.txt \
            --github-output "${GITHUB_OUTPUT}"

      - name: Write Summary
        if: always()
        run: |
          {
            echo "## PostgreSQL Replication Check"
            echo "- ha_mode: ${{ vars.API_DB_HA_MODE || 'physical' }}"
            echo "- primary_host: configured via SSH_HOST_API secret"
            echo "- standby_host: ${{ vars.API_STANDBY_HOST || '193.47.42.213' }}"
            echo "- primary_project_dir: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}"
            echo "- standby_project_dir: ${{ vars.API_STANDBY_PROJECT_DIR || '/opt/mvn-reserve' }}"
            echo "- expected_slot: ${{ vars.POSTGRES_STANDBY_SLOT || 'zakup_standby' }}"
            echo "- max_replay_lag_bytes: ${{ github.event_name == 'workflow_dispatch' && inputs.max_replay_lag_bytes || vars.POSTGRES_REPLICATION_MAX_LAG_BYTES || '1048576' }}"
            echo "- official_maintenance: ${{ steps.maintenance.outputs.active || 'false' }}"
            echo "- log_artifact: postgres-replication-check-log-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replication check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-replication-check-log-${{ github.run_id }}
          path: postgres-replication-check.log
          if-no-files-found: warn

      - name: Upload HA notification state
        if: ${{ always() && steps.ha-event.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ha-notification-state-${{ github.run_id }}
          path: ha-notification-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Notify owner about HA event
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.ha-event.outputs.notify == 'true' }}
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "Событие PostgreSQL HA"
          message-file: ha-owner-message.txt
