name: Turbo Rebuild Web ⚡

on:
  workflow_dispatch:

env:
  SSH_HOST_WEB: ${{ secrets.SSH_HOST_WEB }}
  SSH_USER_WEB: ${{ secrets.SSH_USER_WEB }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Astro Site
        working-directory: ./web
        env:
           # SSR Build: bypass public CDN/WAF checks via SSH tunnel to the API host.
           INTERNAL_API_URL: http://127.0.0.1:18000/api/v1
           # Client-side: Use production API  
           PUBLIC_API_URL: https://api.mvn.by/api/v1
           # Google Tag Manager ID
           PUBLIC_GTM_ID: GTM-5CR6WBBC
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts
          ssh -f -N \
            -L 18000:127.0.0.1:8000 \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=20 \
            ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:18000/api/v1/config >/dev/null
          npm run build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SSH_HOST_WEB }} >> ~/.ssh/known_hosts

      - name: Deploy to Web Server
        run: |
          # Upload files using rsync over SSH
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            web/dist/ \
            ${{ env.SSH_USER_WEB }}@${{ env.SSH_HOST_WEB }}:/var/www/user2154318/data/www/mvn.by/
          
          echo "✅ Turbo Rebuild completed!"
