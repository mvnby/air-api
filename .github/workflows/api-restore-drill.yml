name: API Restore Drill

on:
  schedule:
    - cron: "42 4 * * *"
  workflow_dispatch:

concurrency:
  group: api-restore-drill
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Require Reviewed Main Ref
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Secret-bearing restore workflows run only from refs/heads/main"
            exit 64
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run logical restore drill on the proven Patroni primary
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing required SSH_KEY secret"
            exit 1
          fi
          ssh_identity="${SSH_KEY}"
          unset SSH_KEY
          trap 'ssh_identity=' EXIT
          printf '%s\n' "${ssh_identity}" \
            | python3 -I scripts/ha/run_postgres_pitr_workflow.py \
                --phase logical-restore-drill 2>&1 \
            | tee api-restore-drill.log

      - name: Upload restore drill log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-restore-drill-log-${{ github.run_id }}
          path: api-restore-drill.log
          if-no-files-found: warn

      - name: Notify HA failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "MVN API restore drill failed"
          details: "Artifact: api-restore-drill-log-${{ github.run_id }}"
