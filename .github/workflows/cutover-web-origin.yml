name: Cut Over Web Origin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Audit only, cut over Pages to SSR, or roll back to Pages"
        required: true
        type: choice
        options:
          - audit
          - cutover
          - rollback
        default: audit
      confirmation:
        description: "For cutover enter 153.80.244.78; for rollback enter mvn-by"
        required: false
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mvn-by' }}
  WEB_ORIGIN_IP: "153.80.244.78"

jobs:
  web-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-web
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify SSR origin before cutover
        if: ${{ inputs.operation == 'cutover' }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "${headers}"' EXIT
          curl --fail --silent --show-error --max-time 30 \
            --resolve "mvn.by:443:${WEB_ORIGIN_IP}" \
            --dump-header "${headers}" --output /dev/null \
            https://mvn.by/catalog/
          grep -Eiq '^x-catalog-revision: [0-9]+' "${headers}"
          grep -Eiq '^x-web-data-cache: (hit|miss|shared)[[:space:]]*$' "${headers}"

      - name: Audit or switch Cloudflare web routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES }}
        run: |
          set -euo pipefail
          python3 scripts/cutover_cloudflare_web_origin.py \
            "${{ inputs.operation }}" \
            --confirm "${{ inputs.confirmation }}" \
            | tee cloudflare-web-origin.log

      - name: Configure trusted verification host
        if: ${{ inputs.operation != 'audit' }}
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY}"
          test -n "${SSH_HOST_API}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/web_origin_verify_key
          chmod 0600 ~/.ssh/web_origin_verify_key
          ssh-keyscan -T 10 -H "${SSH_HOST_API}" >> ~/.ssh/known_hosts

      - name: Verify public routing from trusted API host
        if: ${{ inputs.operation != 'audit' }}
        env:
          OPERATION: ${{ inputs.operation }}
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST_API}"
          test -n "${SSH_USER_API}"
          case "${OPERATION}" in
            cutover|rollback) ;;
            *) echo "Invalid operation: ${OPERATION}" >&2; exit 1 ;;
          esac
          ssh \
            -i ~/.ssh/web_origin_verify_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER_API}@${SSH_HOST_API}" \
            "bash -s -- ${OPERATION}" <<'REMOTE'
          set -euo pipefail
          operation="$1"
          for attempt in $(seq 1 30); do
            if [ "${operation}" = "cutover" ]; then
              headers="$(mktemp)"
              if curl --fail --silent --show-error --max-time 30 \
                --dump-header "${headers}" --output /dev/null \
                https://mvn.by/catalog/ \
                && grep -Eiq '^x-catalog-revision: [0-9]+' "${headers}" \
                && grep -Eiq '^x-web-data-cache: (hit|miss|shared)[[:space:]]*$' "${headers}"; then
                rm -f "${headers}"
                exit 0
              fi
              rm -f "${headers}"
            elif curl --fail --silent --show-error --max-time 30 \
              https://mvn.by/release.json \
              | grep -Eq '"sha":"[0-9a-f]{40}"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Public routing did not converge for ${operation}" >&2
          exit 1
          REMOTE

      - name: Upload routing audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-web-origin-${{ github.run_id }}
          path: cloudflare-web-origin.log
          if-no-files-found: warn
          retention-days: 30
