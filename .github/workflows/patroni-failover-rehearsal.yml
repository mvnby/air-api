name: Patroni Failover Rehearsal

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact published Patroni digest (sha256:...)
        required: true
        type: string
  schedule:
    - cron: '35 3 * * 1'

concurrency:
  group: patroni-failover-rehearsal
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Log in to GHCR for exact-image rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run isolated Patroni failover rehearsal
        env:
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ ! "${INPUT_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::image_digest must be an exact sha256 digest"
              exit 1
            fi
            PATRONI_REHEARSAL_IMAGE="ghcr.io/mvnby/air-api/patroni@${INPUT_IMAGE_DIGEST}" \
            PATRONI_REHEARSAL_TIMEOUT=180 \
              bash scripts/ha/rehearse_patroni_failover.sh | tee patroni_rehearsal.log
          else
            PATRONI_REHEARSAL_BUILD_LOCAL=true \
            PATRONI_REHEARSAL_TIMEOUT=180 \
              bash scripts/ha/rehearse_patroni_failover.sh | tee patroni_rehearsal.log
          fi

      - name: Upload rehearsal log
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: patroni-failover-rehearsal-${{ github.run_id }}
          path: patroni_rehearsal.log
          if-no-files-found: warn
          retention-days: 30

      - name: Rehearsal summary
        if: ${{ always() }}
        env:
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          REHEARSAL_RESULT: ${{ job.status }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            image="ghcr.io/mvnby/air-api/patroni@${INPUT_IMAGE_DIGEST}"
            exact_digest_rehearsal=false
            if [ "${REHEARSAL_RESULT}" = "success" ]; then
              exact_digest_rehearsal=true
            fi
          else
            image=source-only-local-build
            exact_digest_rehearsal=false
          fi
          {
            echo '## Patroni Failover Rehearsal'
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- result: ${REHEARSAL_RESULT}"
            echo "- image: ${image}"
            echo "- exact_digest_rehearsal: ${exact_digest_rehearsal}"
            echo '- source_bound_release_evidence: false'
            echo '- topology: 3 isolated etcd members, 2 isolated PostgreSQL nodes'
            echo '- production_data_touched: false'
          } >> "${GITHUB_STEP_SUMMARY}"
