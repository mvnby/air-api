name: CI (Test & Lint)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Create Dummy Env
        run: |
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "POSTGRES_DB=air_conditioners"
            # IMPORTANT: Inside docker network, host is 'db' (service name)
            echo "POSTGRES_SERVER=db"
            echo "POSTGRES_PORT=5432"
            # Construct URL explicitly to be safe
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/air_conditioners"

            echo "SECRET_KEY=dummy_secret_for_tests"
            echo "BOT_TOKEN=dummy_token"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=admin"
            echo "ENVIRONMENT=test"
            echo "WEBSITE_URL=http://localhost:4321"
          } >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build Manager Frontend
        working-directory: ./manager_frontend
        run: |
          npm ci
          npm run build

      - name: Check Storefront
        working-directory: ./web
        run: |
          npm ci
          npm run audit:theme
          npm run test:brands
          npm run test:homepage
          npm run test:catalog
          npm run test:seo

      - name: Start Services
        run: docker compose up -d --build

      - name: Wait for DB
        run: |
          scripts/ci/wait_for_stable_postgres.sh db air_conditioners postgres
          scripts/ci/wait_for_stable_postgres.sh db_test air_conditioners_test postgres

      - name: Verify Alembic Upgrade From Empty Database
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS mvn_migration_ci WITH (FORCE);"
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE DATABASE mvn_migration_ci;"

          migration_url="postgresql+asyncpg://postgres:postgres@db:5432/mvn_migration_ci"
          docker compose run -T --rm --no-deps \
            -e DATABASE_URL="${migration_url}" \
            app alembic upgrade head
          docker compose run -T --rm --no-deps \
            -e DATABASE_URL="${migration_url}" \
            app alembic check

          head_count="$(
            docker compose run -T --rm --no-deps \
              -e DATABASE_URL="${migration_url}" \
              app alembic heads \
              | grep -c '(head)'
          )"
          test "${head_count}" = "1" || {
            echo "Expected exactly one Alembic head, got ${head_count}."
            exit 1
          }

          version_count="$(
            docker compose exec -T db psql -U postgres -d mvn_migration_ci -tAc \
              "SELECT count(*) FROM alembic_version;"
          )"
          test "${version_count}" = "1" || {
            echo "Expected one applied Alembic head, got ${version_count}."
            exit 1
          }

      - name: Verify Manager API Client Is Up To Date
        run: |
          docker compose exec -T app python3 scripts/legacy/extract_openapi.py
          cd manager_frontend
          npm run gen:api
          cd ..
          git diff --exit-code -- openapi.json manager_frontend/src/client || (
            echo "Manager API client is out of sync."
            echo "Run: python3 scripts/legacy/extract_openapi.py && cd manager_frontend && npm run gen:api"
            exit 1
          )

      - name: Run Pytest
        # using the 'app' service where the code lives
        run: docker compose exec -T app pytest -v

      - name: Stop CI Services
        if: always()
        run: docker compose down -v --remove-orphans
