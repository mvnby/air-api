name: CI (Test & Lint)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  manager-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: manager_frontend/package-lock.json

      - name: Build Manager Frontend
        working-directory: ./manager_frontend
        run: |
          npm ci
          npm run build

      - name: Upload Manager Frontend Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manager-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager_frontend/dist
          if-no-files-found: error
          retention-days: 1

  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: manager_frontend/package-lock.json

      - name: Run Manager Frontend Component Tests
        working-directory: ./manager_frontend
        run: |
          npm ci
          npm run test:components

  backend-contracts:
    needs: manager-dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:.github/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: air-api-ci
      CI_APP_IMAGE: air-api-ci-app:latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Manager Frontend Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: manager-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager_frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: manager_frontend/package-lock.json

      - name: Create Dummy Env
        run: |
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "POSTGRES_DB=air_conditioners"
            echo "POSTGRES_SERVER=db"
            echo "POSTGRES_PORT=5432"
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/air_conditioners"
            echo "SECRET_KEY=dummy_secret_for_tests"
            echo "BOT_TOKEN=dummy_token"
            echo "BOT_API_TOKEN=dummy_bot_api_token"
            echo "BOT_API_BASE_URL=http://app:8000/api/internal/bot/v1"
            echo "BOT_ENABLED=false"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=admin"
            echo "ENVIRONMENT=test"
            echo "WEBSITE_URL=http://localhost:4321"
          } > .env

      - name: Install Manager API Client Generator
        working-directory: ./manager_frontend
        run: npm ci

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Immutable API Image With Remote Cache
        id: cached-image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.CI_APP_IMAGE }}
          cache-from: type=gha,scope=air-api-ci-backend-v1,timeout=3m
          # Keep one writer per workflow run. PR caches remain scoped to their
          # merge ref; forks restore the trusted base cache but cannot export.
          cache-to: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=min,scope=air-api-ci-backend-v1,ignore-error=true,timeout=5m' || '' }}
          provenance: false
          sbom: false

      - name: Fall Back to Uncached API Image Build
        if: steps.cached-image.outcome == 'failure'
        run: |
          echo "::warning::Remote Docker cache unavailable; rebuilding without it."
          docker build --pull --tag "${CI_APP_IMAGE}" .

      - name: Start Backend Contract Services
        run: docker compose up -d --no-build app

      - name: Wait for DB
        run: scripts/ci/wait_for_stable_postgres.sh db air_conditioners postgres

      - name: Verify Alembic Upgrade From Empty Database
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS mvn_migration_ci WITH (FORCE);"
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE DATABASE mvn_migration_ci;"

          migration_url="postgresql+asyncpg://postgres:postgres@db:5432/mvn_migration_ci"
          docker compose run -T --rm --no-deps \
            -e DATABASE_URL="${migration_url}" \
            app alembic upgrade head
          docker compose run -T --rm --no-deps \
            -e DATABASE_URL="${migration_url}" \
            app alembic check

          head_count="$(
            docker compose run -T --rm --no-deps \
              -e DATABASE_URL="${migration_url}" \
              app alembic heads \
              | grep -c '(head)'
          )"
          test "${head_count}" = "1" || {
            echo "Expected exactly one Alembic head, got ${head_count}."
            exit 1
          }

          version_count="$(
            docker compose exec -T db psql -U postgres -d mvn_migration_ci -tAc \
              "SELECT count(*) FROM alembic_version;"
          )"
          test "${version_count}" = "1" || {
            echo "Expected one applied Alembic head, got ${version_count}."
            exit 1
          }

      - name: Verify Manager API Client Is Up To Date
        run: |
          docker compose exec -T app python3 scripts/legacy/extract_openapi.py
          cd manager_frontend
          npm run gen:api
          cd ..
          git diff --exit-code -- openapi.json manager_frontend/src/client || (
            echo "Manager API client is out of sync."
            echo "Run: python3 scripts/legacy/extract_openapi.py && cd manager_frontend && npm run gen:api"
            exit 1
          )

      - name: Stop Backend Contract Services
        if: always()
        run: docker compose down -v --remove-orphans

  python-tests:
    name: pytest-${{ matrix.suite }}
    needs: manager-dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.yml:.github/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: air-api-ci
      CI_APP_IMAGE: air-api-ci-app:latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Manager Frontend Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: manager-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager_frontend/dist

      - name: Create Dummy Env
        run: |
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "POSTGRES_DB=air_conditioners"
            echo "POSTGRES_SERVER=db"
            echo "POSTGRES_PORT=5432"
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/air_conditioners"
            echo "SECRET_KEY=dummy_secret_for_tests"
            echo "BOT_TOKEN=dummy_token"
            echo "BOT_API_TOKEN=dummy_bot_api_token"
            echo "BOT_API_BASE_URL=http://app:8000/api/internal/bot/v1"
            echo "BOT_ENABLED=false"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=admin"
            echo "ENVIRONMENT=test"
            echo "WEBSITE_URL=http://localhost:4321"
          } > .env

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Immutable Test Image With Remote Cache
        id: cached-image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.CI_APP_IMAGE }}
          # Restore-only: backend-contracts owns cache export for this run.
          cache-from: type=gha,scope=air-api-ci-backend-v1,timeout=3m
          provenance: false
          sbom: false

      - name: Fall Back to Uncached Test Image Build
        if: steps.cached-image.outcome == 'failure'
        run: |
          echo "::warning::Remote Docker cache unavailable; rebuilding without it."
          docker build --pull --tag "${CI_APP_IMAGE}" .

      - name: Start Isolated Test Services
        run: docker compose up -d --no-build app db_test

      - name: Wait for DB
        run: |
          scripts/ci/wait_for_stable_postgres.sh db air_conditioners postgres
          scripts/ci/wait_for_stable_postgres.sh db_test air_conditioners_test postgres

      - name: Run ${{ matrix.suite }} Tests
        run: |
          suite="${{ matrix.suite }}"
          results_dir="${PWD}/test-results/${suite}"
          mkdir -p "${results_dir}"
          app_container="$(docker compose ps -q app)"
          app_image="$(docker inspect --format '{{.Image}}' "${app_container}")"
          docker run --rm \
            --network "container:${app_container}" \
            --mount "type=bind,src=${PWD}/.github,dst=/app/.github,readonly" \
            --mount "type=bind,src=${results_dir},dst=/test-results" \
            --env-file .env \
            -e SCHEDULER_ENABLED=false \
            -e PYTEST_SUITE="${suite}" \
            "${app_image}" \
            sh -ec '
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-client
              export TEST_DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER:-mvnadmin}:${POSTGRES_PASSWORD:-securepass}@db_test:5432/air_conditioners_test"
              if [ "${PYTEST_SUITE}" = "integration" ]; then
                EXPECT_XDIST_DATABASE_ISOLATION=1 \
                  pytest -q -n 2 --dist load \
                    tests/integration/test_postgres_worker_database_isolation.py
              fi
              set +e
              pytest -q -n 2 --dist loadscope \
                --tb=short --durations=25 --durations-min=1.0 \
                --junitxml=/test-results/results.xml \
                "tests/${PYTEST_SUITE}"
              pytest_status=$?
              chmod 0644 /test-results/results.xml 2>/dev/null || true
              exit "${pytest_status}"
            '

      - name: Upload Pytest Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.suite }}-results-${{ github.run_id }}
          path: test-results/${{ matrix.suite }}/results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Isolated Test Services
        if: always()
        run: docker compose down -v --remove-orphans

  test:
    if: always()
    needs: [manager-dist, manager, backend-contracts, python-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Every CI Lane
        env:
          MANAGER_DIST_RESULT: ${{ needs.manager-dist.result }}
          MANAGER_RESULT: ${{ needs.manager.result }}
          BACKEND_CONTRACTS_RESULT: ${{ needs.backend-contracts.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
        run: |
          printf '%s\n' \
            "manager-dist=${MANAGER_DIST_RESULT}" \
            "manager=${MANAGER_RESULT}" \
            "backend-contracts=${BACKEND_CONTRACTS_RESULT}" \
            "python-tests=${PYTHON_TESTS_RESULT}"
          test "${MANAGER_DIST_RESULT}" = "success"
          test "${MANAGER_RESULT}" = "success"
          test "${BACKEND_CONTRACTS_RESULT}" = "success"
          test "${PYTHON_TESTS_RESULT}" = "success"
