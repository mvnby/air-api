name: Deploy API Standby

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Exact CI-tested commit to check out
        required: true
        type: string
      backend_image:
        description: Immutable backend digest deployed on the primary
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-api-standby:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: standby-api
    permissions:
      contents: read
      deployments: write
      packages: read
    env:
      API_STANDBY_HOST: ${{ vars.API_STANDBY_HOST }}
      API_STANDBY_USER: ${{ vars.API_STANDBY_USER || 'root' }}
      API_STANDBY_PROJECT_DIR: ${{ vars.API_STANDBY_PROJECT_DIR || '/opt/air-api' }}
      API_STANDBY_COMPOSE_FILE: ${{ vars.API_STANDBY_COMPOSE_FILE || 'docker-compose.prod.yml' }}
      # A standby image must never advance without the matching mount contract.
      API_STANDBY_COPY_COMPOSE: 'true'
      API_STANDBY_COMPOSE_SOURCE_FILE: ${{ vars.API_STANDBY_COMPOSE_SOURCE_FILE || vars.API_STANDBY_COMPOSE_FILE || 'docker-compose.prod.yml' }}
      API_STANDBY_HEALTH_URL: ${{ vars.API_STANDBY_HEALTH_URL || 'http://localhost:8000/api/health' }}
      API_PRIMARY_ORIGIN: ${{ vars.API_PRIMARY_ORIGIN || '185.250.45.54' }}
      API_STANDBY_ORIGIN: ${{ vars.API_STANDBY_ORIGIN || '193.47.42.213' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Setup SSH Key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "${API_STANDBY_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy standby API app image
        id: deploy_standby
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          )
          SCP_OPTS=("${SSH_OPTS[@]}")
          echo "Deploying standby backend image: ${BACKEND_IMAGE}"
          deploy_compose_file="${API_STANDBY_COMPOSE_FILE}"

          if [ "${API_STANDBY_COPY_COMPOSE}" = "true" ]; then
            if [ ! -f "${API_STANDBY_COMPOSE_SOURCE_FILE}" ]; then
              echo "::error::API_STANDBY_COMPOSE_SOURCE_FILE not found: ${API_STANDBY_COMPOSE_SOURCE_FILE}"
              exit 1
            fi
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${API_STANDBY_USER}@${API_STANDBY_HOST}" "mkdir -p '${API_STANDBY_PROJECT_DIR}'"
            deploy_compose_file="${API_STANDBY_COMPOSE_FILE}.candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            scp "${SCP_OPTS[@]}" "${API_STANDBY_COMPOSE_SOURCE_FILE}" \
              "${API_STANDBY_USER}@${API_STANDBY_HOST}:${API_STANDBY_PROJECT_DIR}/${deploy_compose_file}"
          fi

          cat scripts/ha/promote_local_standby.sh | ssh "${SSH_OPTS[@]}" "${API_STANDBY_USER}@${API_STANDBY_HOST}" "install -m 0755 /dev/stdin /usr/local/sbin/mvn-promote-local-standby"
          cat scripts/ha/mvn-standby-status.sh | ssh "${SSH_OPTS[@]}" "${API_STANDBY_USER}@${API_STANDBY_HOST}" "install -m 0755 /dev/stdin /usr/local/sbin/mvn-standby-status"
          bundle_sources=(
            scripts/deploy.sh scripts/prepare_google_oauth_token_dir.sh
            scripts/post_deploy_smoke_check.sh scripts/compose_candidate_transaction.sh
            scripts/reconcile_backend_compose_runtime.sh
            scripts/deploy_backend_candidate_transaction.sh
            scripts/ha/safe_deploy_lock.py
          )
          lock_helper_sha256="$(sha256sum scripts/ha/safe_deploy_lock.py | awk '{print $1}')"

          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote "${API_STANDBY_USER}@${API_STANDBY_HOST}" \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-standby-deploy --entry deploy_backend_candidate_transaction.sh \
            --secret-env GHCR_PAT --print-required standby_smoke_summary.txt \
            --env "GITHUB_ACTOR=${{ github.actor }}" \
            --env "API_PROJECT_DIR=${API_STANDBY_PROJECT_DIR}" \
            --env "API_ACTIVE_SLOT_FILE=${API_STANDBY_PROJECT_DIR}/.standby-api-slot-disabled" \
            --env "API_CANONICAL_COMPOSE_FILE=${API_STANDBY_PROJECT_DIR}/${API_STANDBY_COMPOSE_FILE}" \
            --env "API_CANDIDATE_COMPOSE_FILE=${API_STANDBY_PROJECT_DIR}/${deploy_compose_file}" \
            --env "API_COMPOSE_TRANSACTIONAL=${API_STANDBY_COPY_COMPOSE}" \
            --env API_DEPLOY_STRATEGY=in_place --env API_DEPLOY_SERVICES=app \
            --env API_MIGRATION_SERVICE=app --env API_RUN_MIGRATIONS=false \
            --env API_RUN_DEFAULTS=false --env API_STOP_SERVICES_AFTER_DEPLOY=bot \
            --env API_IN_PLACE_DEPLOY_SCRIPT=__MVN_BUNDLE__/deploy.sh \
            --env API_SMOKE_SCRIPT=__MVN_BUNDLE__/post_deploy_smoke_check.sh \
            --env API_RECONCILE_SCRIPT=__MVN_BUNDLE__/reconcile_backend_compose_runtime.sh \
            --env API_DEPLOY_LOCK_HELPER=__MVN_BUNDLE__/safe_deploy_lock.py \
            --env "API_DEPLOY_LOCK_HELPER_SHA256=${lock_helper_sha256}" \
            --env COMPOSE_CANDIDATE_TRANSACTION_SCRIPT=__MVN_BUNDLE__/compose_candidate_transaction.sh \
            --env GOOGLE_OAUTH_TOKEN_PREPARE_SCRIPT=__MVN_BUNDLE__/prepare_google_oauth_token_dir.sh \
            --env "BASE_URL=${API_STANDBY_HEALTH_URL%/api/health}" \
            --env "READY_URL=${API_STANDBY_HEALTH_URL%/api/health}/api/ready" \
            --env READY_EXPECTATION=fenced --env COMPOSE_SERVICE_CHECKS=app \
            --env BOT_EXPECT_ENABLED=false --env "API_READY_URL=${API_STANDBY_HEALTH_URL}" \
            --env "BACKEND_IMAGE=${BACKEND_IMAGE}" \
            --env SMOKE_SUMMARY_FILE=__MVN_BUNDLE__/standby_smoke_summary.txt \
            "${bundle_sources[@]}"

      - name: Roll Back Standby After Failed Activation
        id: rollback_standby
        if: ${{ always() && steps.deploy_standby.outcome == 'failure' }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          bundle_sources=(scripts/rollback_backend.sh scripts/ha/safe_deploy_lock.py)
          lock_helper_sha256="$(sha256sum scripts/ha/safe_deploy_lock.py | awk '{print $1}')"
          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote "${API_STANDBY_USER}@${API_STANDBY_HOST}" \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-standby-rollback --entry rollback_backend.sh \
            --secret-env GHCR_PAT --env CONFIRM_ROLLBACK=true \
            --env "API_PROJECT_DIR=${API_STANDBY_PROJECT_DIR}" \
            --env "API_ACTIVE_SLOT_FILE=${API_STANDBY_PROJECT_DIR}/.standby-api-slot-disabled" \
            --env "API_COMPOSE_FILE=${API_STANDBY_COMPOSE_FILE}" \
            --env API_DEPLOY_SERVICES=app --env "API_READY_URL=${API_STANDBY_HEALTH_URL}" \
            --env API_FORCE_COMPOSE_RECONCILE_ON_NOOP=true \
            --env API_DEPLOY_LOCK_HELPER=__MVN_BUNDLE__/safe_deploy_lock.py \
            --env "API_DEPLOY_LOCK_HELPER_SHA256=${lock_helper_sha256}" \
            --env 'EXPECTED_CURRENT_IMAGE=${{ inputs.backend_image }}' \
            "${bundle_sources[@]}" | tee standby_rollback.log

      - name: Post-Standby Active-Passive Invariant Check
        id: standby_active_passive
        run: |
          set -euo pipefail
          CHECK_PUBLIC_READY=false \
          PRIMARY_ORIGIN="${API_PRIMARY_ORIGIN}" \
          STANDBY_ORIGIN="${API_STANDBY_ORIGIN}" \
          bash scripts/ha/check_active_passive.sh 2>&1 | tee standby_active_passive.log

      - name: Prune Unused Standby Docker Images
        id: prune_standby_images
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote "${API_STANDBY_USER}@${API_STANDBY_HOST}" \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-standby-prune --entry prune_unused_docker_images.sh \
            --env KEEP_BACKEND_IMAGES=3 scripts/prune_unused_docker_images.sh \
            | tee standby_docker_prune.log

      - name: Upload Standby Deploy Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standby-deploy-logs-${{ github.run_id }}
          path: |
            standby_active_passive.log
            standby_rollback.log
            standby_docker_prune.log
          if-no-files-found: warn

      - name: Standby Deploy Summary
        if: always()
        run: |
          {
            echo "## Standby API Deploy Summary"
            echo "- standby_host: ${API_STANDBY_HOST}"
            echo "- standby_project_dir: ${API_STANDBY_PROJECT_DIR}"
            echo "- standby_compose_file: ${API_STANDBY_COMPOSE_FILE}"
            echo "- standby_copy_compose: ${API_STANDBY_COPY_COMPOSE}"
            echo "- standby_compose_source_file: ${API_STANDBY_COMPOSE_SOURCE_FILE}"
            echo "- backend_image: ${{ inputs.backend_image }}"
            echo "- health_url: ${API_STANDBY_HEALTH_URL}"
            echo "- primary_origin: ${API_PRIMARY_ORIGIN}"
            echo "- standby_origin: ${API_STANDBY_ORIGIN}"
            echo "- active_passive_status: ${{ steps.standby_active_passive.outcome }}"
            echo "- rollback_status: ${{ steps.rollback_standby.outcome }}"
            echo "- docker_prune_status: ${{ steps.prune_standby_images.outcome }}"
            if [ -f standby_active_passive.log ]; then
              echo "- active_passive_log: collected"
            fi
            if [ -f standby_docker_prune.log ]; then
              echo "- docker_prune_log: collected"
            fi
            echo "- status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
