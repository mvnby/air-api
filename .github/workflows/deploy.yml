name: Deploy to Production 🚀

on:
  workflow_run:
    workflows:
      - CI (Test & Lint)
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Run frontend deployment after backend"
        type: boolean
        required: false
        default: false

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ======================================================
  # 0. RELEASE GATE AND FRONTEND CHANGE DETECTION
  # ======================================================
  release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}

    steps:
      - name: Resolve tested release SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            deploy_sha="${{ github.event.workflow_run.head_sha }}"
            head_branch="${{ github.event.workflow_run.head_branch }}"
            conclusion="${{ github.event.workflow_run.conclusion }}"
            if [ "${head_branch}" != "main" ] || [ "${conclusion}" != "success" ]; then
              echo "::error::Refusing release: branch=${head_branch} conclusion=${conclusion}"
              exit 1
            fi
          else
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Manual production deploys are allowed only from main"
              exit 1
            fi
            deploy_sha="${GITHUB_SHA}"
            successful_run_count="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow ci.yml \
                --branch main \
                --commit "${deploy_sha}" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq 'length'
            )"
            if [ "${successful_run_count}" != "1" ]; then
              echo "::error::No successful CI run found for ${deploy_sha}"
              exit 1
            fi
          fi

          echo "deploy_sha=${deploy_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release Gate"
            echo "- event: ${{ github.event_name }}"
            echo "- tested_sha: ${deploy_sha}"
            echo "- result: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  detect-frontend-changes:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web_changed: ${{ steps.detect.outputs.web_changed }}
      reason: ${{ steps.detect.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release-gate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Detect storefront-relevant changes
        id: detect
        run: |
          set -euo pipefail

          web_changed=false
          reason="no storefront-relevant changes detected"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deploy_frontend }}" = "true" ]; then
              web_changed=true
              reason="manual dispatch requested deploy_frontend=true"
            else
              reason="manual dispatch did not request frontend deploy"
            fi
          else
            after="${{ needs.release-gate.outputs.deploy_sha }}"
            deployed_web_sha="$(
              curl -fsS --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                "https://mvn.by/release.json?ci_run=${GITHUB_RUN_ID}" 2>/dev/null \
                | jq -r '.sha // empty' 2>/dev/null \
                || true
            )"
            if [[ "${deployed_web_sha}" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${deployed_web_sha}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "${deployed_web_sha}" "${after}"; then
              if git diff --name-only "${deployed_web_sha}" "${after}" | grep -E '^(web/|\.github/workflows/(deploy|deploy-web|rebuild-web|check-web-ssh)\.yml$|scripts/(check_web_dist\.py|deploy_cloudflare_pages\.sh|deploy_web_atomic\.sh|promote_web_release\.sh)$)' >/dev/null; then
                web_changed=true
                reason="storefront-relevant files changed since deployed web SHA"
              else
                reason="no storefront-relevant changes since deployed web SHA"
              fi
            else
              web_changed=true
              reason="deployed web SHA is unavailable or not an ancestor; deploying frontend conservatively"
            fi
          fi

          echo "web_changed=${web_changed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

          {
            echo "## Frontend Deploy Decision"
            echo "- web_changed: ${web_changed}"
            echo "- reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-deploy-decision:
    runs-on: ubuntu-latest
    needs: detect-frontend-changes
    steps:
      - name: Report frontend deploy decision
        run: |
          {
            echo "## Frontend Deploy Decision"
            echo "- web_changed: ${{ needs.detect-frontend-changes.outputs.web_changed }}"
            echo "- reason: ${{ needs.detect-frontend-changes.outputs.reason }}"
            if [ "${{ needs.detect-frontend-changes.outputs.web_changed }}" != "true" ]; then
              echo "- result: deploy-frontend will be skipped; backend deploy can still make this workflow green"
            else
              echo "- result: deploy-frontend is eligible to run after backend deploy"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ======================================================
  # 1. BACKEND DEPLOYMENT (Docker -> mvn-api)
  # ======================================================
  deploy-backend:
    if: ${{ vars.API_DB_HA_MODE != 'patroni' }}
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-api
    outputs:
      backend_image: ${{ steps.resolve_backend_image.outputs.reference }}
    permissions:
      contents: read
      deployments: write
      packages: write
    env:
      API_PROJECT_DIR: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}
      API_COMPOSE_FILE: ${{ vars.API_COMPOSE_FILE || 'docker-compose.prod.yml' }}
      API_COMPOSE_SOURCE_FILE: ${{ vars.API_COMPOSE_SOURCE_FILE || 'docker-compose.prod.yml' }}
      API_COPY_COMPOSE: ${{ vars.API_COPY_COMPOSE || 'true' }}
      API_DEPLOY_STRATEGY: ${{ vars.API_DEPLOY_STRATEGY || 'blue_green' }}
      API_DEPLOY_SERVICES: ${{ vars.API_DEPLOY_SERVICES || 'app bot' }}
      API_MIGRATION_SERVICE: ${{ vars.API_MIGRATION_SERVICE || 'app' }}
      API_RUN_MIGRATIONS: ${{ vars.API_RUN_MIGRATIONS || 'true' }}
      API_RUN_DEFAULTS: ${{ vars.API_RUN_DEFAULTS || 'true' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:18080' }}
      API_READY_URL: ${{ vars.API_READY_URL || 'http://localhost:18080/api/ready' }}
      API_SMOKE_COMPOSE_SERVICE_CHECKS: ${{ vars.API_SMOKE_COMPOSE_SERVICE_CHECKS || 'app bot' }}
      API_BOT_EXPECT_ENABLED: ${{ vars.API_BOT_EXPECT_ENABLED || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release-gate.outputs.deploy_sha }}

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Build Manager Frontend (Required for Backend Image)
        working-directory: ./manager_frontend
        env:
          WEBSITE_URL: https://mvn.by
        run: |
          npm ci
          npm run build

      - name: Lowercase Repo Name
        id: prep
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend (App + Bot) [Attempt 1]
        id: backend_push_1
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ needs.release-gate.outputs.deploy_sha }}

      - name: Build and push Backend (App + Bot) [Attempt 2]
        id: backend_push_2
        if: steps.backend_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ needs.release-gate.outputs.deploy_sha }}

      - name: Build and push Backend (App + Bot) [Attempt 3]
        id: backend_push_3
        if: steps.backend_push_1.outcome == 'failure' && steps.backend_push_2.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ needs.release-gate.outputs.deploy_sha }}

      - name: Resolve Immutable Backend Image
        id: resolve_backend_image
        run: |
          set -euo pipefail
          digest="${{ steps.backend_push_1.outputs.digest }}"
          if [ -z "${digest}" ] && [ "${{ steps.backend_push_2.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_2.outputs.digest }}"
          fi
          if [ -z "${digest}" ] && [ "${{ steps.backend_push_3.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_3.outputs.digest }}"
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not produce a valid image digest: ${digest:-empty}"
            exit 1
          fi
          reference="ghcr.io/${{ steps.prep.outputs.repo }}/backend@${digest}"
          echo "reference=${reference}" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable image ${reference}"

      # Diagnostic step: Check if API server is reachable
      - name: Test API Server Connectivity
        run: |
          echo "🔍 Testing connection to API server..."
          echo "Host: ${{ secrets.SSH_HOST_API }}"
          echo "User: ${{ secrets.SSH_USER_API }}"
          echo "Project dir: ${API_PROJECT_DIR}"
          echo "Compose file: ${API_COMPOSE_FILE}"
          echo "Compose source file: ${API_COMPOSE_SOURCE_FILE}"
          
          # Test if host is reachable (allow failure for diagnosis)
          ping -c 3 ${{ secrets.SSH_HOST_API }} || echo "⚠️ Ping failed, but SSH might still work"
          
          # Test if SSH port 22 is open
          nc -zv ${{ secrets.SSH_HOST_API }} 22 2>&1 || echo "⚠️ Port 22 check failed"
          
          echo "✅ Connectivity tests completed"

      - name: Validate API SSH Reachability (Required)
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SSH_HOST_API }}" ] || [ -z "${{ secrets.SSH_USER_API }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing one of required secrets: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi

          echo "🔐 Validating SSH port reachability for ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}..."
          if ! nc -z -w 10 ${{ secrets.SSH_HOST_API }} 22; then
            echo "::error::SSH port 22 is unreachable for API host. Check host/network/firewall before deploy."
            exit 1
          fi
          echo "✅ SSH port is reachable"

      - name: Copy Compose Files and Scripts to Server
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SSH_OPTS=(
            -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v
          )
          # shellcheck disable=SC2029
          ssh "${SSH_OPTS[@]}" ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "mkdir -p '${API_PROJECT_DIR}'"

          if [ "${API_COPY_COMPOSE}" = "true" ]; then
            if [ ! -f "${API_COMPOSE_SOURCE_FILE}" ]; then
              echo "::error::API_COMPOSE_SOURCE_FILE not found: ${API_COMPOSE_SOURCE_FILE}"
              exit 1
            fi
            candidate_file="${API_COMPOSE_FILE}.candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "📄 Staging ${API_COMPOSE_SOURCE_FILE} as ${API_PROJECT_DIR}/${candidate_file}"
            scp \
              -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -v "${API_COMPOSE_SOURCE_FILE}" \
              "${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}:${API_PROJECT_DIR}/${candidate_file}"
          else
            echo "⏭️ API_COPY_COMPOSE=${API_COPY_COMPOSE}; keeping remote compose unchanged"
          fi
          
      - name: Execute Deployment Script
        id: deploy_backend
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v
          )
          candidate_file="${API_COMPOSE_FILE}"
          if [ "${API_COPY_COMPOSE}" = "true" ]; then
            candidate_file="${API_COMPOSE_FILE}.candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          cat scripts/ha/mvn-primary-status.sh | ssh "${SSH_OPTS[@]}" ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "install -m 0755 /dev/stdin /usr/local/sbin/mvn-primary-status"
          bundle_sources=(
            scripts/deploy.sh scripts/deploy_backend_blue_green.sh
            scripts/deploy_backend_blue_green_safety.sh
            scripts/prepare_google_oauth_token_dir.sh
            scripts/post_deploy_smoke_check.sh scripts/compose_candidate_transaction.sh
            scripts/reconcile_backend_compose_runtime.sh
            scripts/deploy_backend_candidate_transaction.sh
            scripts/ha/safe_deploy_lock.py
          )
          lock_helper_sha256="$(sha256sum scripts/ha/safe_deploy_lock.py | awk '{print $1}')"
          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote '${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}' \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-backend-deploy --entry deploy_backend_candidate_transaction.sh \
            --secret-env GHCR_PAT --print-required smoke_summary.txt \
            --print-optional backend_blue_green_summary.txt \
            --env "GITHUB_ACTOR=${{ github.actor }}" \
            --env "API_PROJECT_DIR=${API_PROJECT_DIR}" \
            --env "API_CANONICAL_COMPOSE_FILE=${API_PROJECT_DIR}/${API_COMPOSE_FILE}" \
            --env "API_CANDIDATE_COMPOSE_FILE=${API_PROJECT_DIR}/${candidate_file}" \
            --env "API_COMPOSE_TRANSACTIONAL=${API_COPY_COMPOSE}" \
            --env "API_DEPLOY_STRATEGY=${API_DEPLOY_STRATEGY}" \
            --env "API_DEPLOY_SERVICES=${API_DEPLOY_SERVICES}" \
            --env "API_MIGRATION_SERVICE=${API_MIGRATION_SERVICE}" \
            --env "API_RUN_MIGRATIONS=${API_RUN_MIGRATIONS}" \
            --env "API_RUN_DEFAULTS=${API_RUN_DEFAULTS}" \
            --env API_BLUE_GREEN_SCRIPT=__MVN_BUNDLE__/deploy_backend_blue_green.sh \
            --env API_BLUE_GREEN_SAFETY_HELPER=__MVN_BUNDLE__/deploy_backend_blue_green_safety.sh \
            --env API_IN_PLACE_DEPLOY_SCRIPT=__MVN_BUNDLE__/deploy.sh \
            --env API_SMOKE_SCRIPT=__MVN_BUNDLE__/post_deploy_smoke_check.sh \
            --env API_RECONCILE_SCRIPT=__MVN_BUNDLE__/reconcile_backend_compose_runtime.sh \
            --env API_DEPLOY_LOCK_HELPER=__MVN_BUNDLE__/safe_deploy_lock.py \
            --env "API_DEPLOY_LOCK_HELPER_SHA256=${lock_helper_sha256}" \
            --env COMPOSE_CANDIDATE_TRANSACTION_SCRIPT=__MVN_BUNDLE__/compose_candidate_transaction.sh \
            --env GOOGLE_OAUTH_TOKEN_PREPARE_SCRIPT=__MVN_BUNDLE__/prepare_google_oauth_token_dir.sh \
            --env "BASE_URL=${API_BASE_URL}" --env "READY_URL=${API_READY_URL}" \
            --env "COMPOSE_SERVICE_CHECKS=${API_SMOKE_COMPOSE_SERVICE_CHECKS}" \
            --env "BOT_EXPECT_ENABLED=${API_BOT_EXPECT_ENABLED}" \
            --env 'BACKEND_IMAGE=${{ steps.resolve_backend_image.outputs.reference }}' \
            --env API_BLUE_GREEN_SUMMARY_FILE=__MVN_BUNDLE__/backend_blue_green_summary.txt \
            --env SMOKE_SUMMARY_FILE=__MVN_BUNDLE__/smoke_summary.txt \
            "${bundle_sources[@]}" 2>&1 | tee backend_deploy.log

      - name: Optional Post-Deploy Backend Ops
        id: post_deploy_ops
        continue-on-error: true
        env:
          RUN_POST_DEPLOY_OPS: ${{ secrets.RUN_POST_DEPLOY_OPS }}
          OPS_MODE: ${{ secrets.OPS_MODE }}
          RUN_NORMALIZE_LEGACY: ${{ secrets.RUN_NORMALIZE_LEGACY }}
          RUN_BACKFILL_BRAND_SERIES: ${{ secrets.RUN_BACKFILL_BRAND_SERIES }}
          RUN_SAFE_BRAND_CLEANUP: ${{ secrets.RUN_SAFE_BRAND_CLEANUP }}
          HIDE_LEGACY_GROUPS: ${{ secrets.HIDE_LEGACY_GROUPS }}
          RUN_REPORT_LEGACY_LINKS: ${{ secrets.RUN_REPORT_LEGACY_LINKS }}
          RUN_CLEANUP_LEGACY_LINKS: ${{ secrets.RUN_CLEANUP_LEGACY_LINKS }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: |
          set -euo pipefail
          : "${RUN_POST_DEPLOY_OPS:=true}"
          : "${OPS_MODE:=report_only}"
          : "${RUN_NORMALIZE_LEGACY:=false}"
          : "${RUN_BACKFILL_BRAND_SERIES:=false}"
          : "${RUN_SAFE_BRAND_CLEANUP:=false}"
          : "${RUN_REPORT_LEGACY_LINKS:=true}"
          : "${RUN_CLEANUP_LEGACY_LINKS:=false}"
          : "${DRY_RUN:=true}"

          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote '${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}' \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-backend-ops --entry ops_post_deploy.sh \
            --print-required ops_summary.txt \
            --env "RUN_POST_DEPLOY_OPS=${RUN_POST_DEPLOY_OPS}" \
            --env "OPS_MODE=${OPS_MODE}" --env "RUN_NORMALIZE_LEGACY=${RUN_NORMALIZE_LEGACY}" \
            --env "RUN_BACKFILL_BRAND_SERIES=${RUN_BACKFILL_BRAND_SERIES}" \
            --env "RUN_SAFE_BRAND_CLEANUP=${RUN_SAFE_BRAND_CLEANUP}" \
            --env "HIDE_LEGACY_GROUPS=${HIDE_LEGACY_GROUPS}" \
            --env "RUN_REPORT_LEGACY_LINKS=${RUN_REPORT_LEGACY_LINKS}" \
            --env "RUN_CLEANUP_LEGACY_LINKS=${RUN_CLEANUP_LEGACY_LINKS}" \
            --env "DRY_RUN=${DRY_RUN}" --env "API_PROJECT_DIR=${API_PROJECT_DIR}" \
            --env "API_COMPOSE_FILE=${API_COMPOSE_FILE}" \
            --env 'BACKEND_IMAGE=${{ steps.resolve_backend_image.outputs.reference }}' \
            --env OPS_SUMMARY_FILE=__MVN_BUNDLE__/ops_summary.txt \
            scripts/ops_post_deploy.sh | tee backend_ops.log

      - name: Post-Deploy Smoke Check
        id: post_deploy_smoke
        run: |
          set -euo pipefail
          grep -Fq 'smoke_status=passed' backend_deploy.log
          grep -Fq 'backend candidate activation, smoke, and compose promotion completed' backend_deploy.log
          cp backend_deploy.log backend_smoke.log

      - name: Roll Back Backend After Failed Activation
        id: rollback_backend
        if: ${{ always() && steps.deploy_backend.outcome == 'failure' }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          bundle_sources=(
            scripts/deploy_backend_blue_green.sh
            scripts/deploy_backend_blue_green_safety.sh
            scripts/prepare_google_oauth_token_dir.sh scripts/rollback_backend.sh
            scripts/ha/safe_deploy_lock.py
          )
          lock_helper_sha256="$(sha256sum scripts/ha/safe_deploy_lock.py | awk '{print $1}')"
          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote '${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}' \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-backend-rollback --entry rollback_backend.sh \
            --secret-env GHCR_PAT --env "GITHUB_ACTOR=${{ github.actor }}" \
            --env CONFIRM_ROLLBACK=true --env "API_PROJECT_DIR=${API_PROJECT_DIR}" \
            --env "API_COMPOSE_FILE=${API_COMPOSE_FILE}" \
            --env "API_DEPLOY_SERVICES=${API_DEPLOY_SERVICES}" \
            --env "API_READY_URL=${API_READY_URL}" \
            --env API_BLUE_GREEN_SCRIPT=__MVN_BUNDLE__/deploy_backend_blue_green.sh \
            --env API_BLUE_GREEN_SAFETY_HELPER=__MVN_BUNDLE__/deploy_backend_blue_green_safety.sh \
            --env API_DEPLOY_LOCK_HELPER=__MVN_BUNDLE__/safe_deploy_lock.py \
            --env "API_DEPLOY_LOCK_HELPER_SHA256=${lock_helper_sha256}" \
            --env GOOGLE_OAUTH_TOKEN_PREPARE_SCRIPT=__MVN_BUNDLE__/prepare_google_oauth_token_dir.sh \
            --env API_BLUE_GREEN_SUMMARY_FILE=__MVN_BUNDLE__/rollback_blue_green_summary.txt \
            --env API_FORCE_COMPOSE_RECONCILE_ON_NOOP=true \
            --env 'EXPECTED_CURRENT_IMAGE=${{ steps.resolve_backend_image.outputs.reference }}' \
            "${bundle_sources[@]}" | tee backend_rollback.log

      - name: Prune Unused Backend Docker Images
        id: prune_backend_images
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ha/run_verified_remote_bundle.py \
            --remote '${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}' \
            --identity-file ~/.ssh/deploy_key --known-hosts-file ~/.ssh/known_hosts \
            --prefix mvn-backend-prune --entry prune_unused_docker_images.sh \
            --env KEEP_BACKEND_IMAGES=3 scripts/prune_unused_docker_images.sh \
            | tee backend_docker_prune.log

      - name: Upload Backend Ops Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-ops-logs-${{ github.run_id }}
          path: |
            backend_deploy.log
            backend_ops.log
            backend_smoke.log
            backend_rollback.log
            backend_docker_prune.log
          if-no-files-found: warn

      - name: Backend Deploy Summary
        if: always()
        run: |
          digest="${{ steps.backend_push_1.outputs.digest }}"
          if [ -z "$digest" ] && [ "${{ steps.backend_push_2.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_2.outputs.digest }}"
          fi
          if [ -z "$digest" ] && [ "${{ steps.backend_push_3.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_3.outputs.digest }}"
          fi
          if [ -z "$digest" ]; then
            digest="n/a"
          fi
          {
            echo "## Backend Deploy Summary"
            echo "- image: ghcr.io/${{ steps.prep.outputs.repo }}/backend"
            echo "- backend_image: ${{ steps.resolve_backend_image.outputs.reference }}"
            echo "- digest: ${digest}"
            echo "- commit_sha: ${{ needs.release-gate.outputs.deploy_sha }}"
            echo "- api_project_dir: ${API_PROJECT_DIR}"
            echo "- api_compose_file: ${API_COMPOSE_FILE}"
            echo "- api_deploy_strategy: ${API_DEPLOY_STRATEGY}"
            echo "- api_deploy_services: ${API_DEPLOY_SERVICES}"
            echo "- deploy_status: ${{ steps.deploy_backend.outcome }}"
            echo "- ops_status: ${{ steps.post_deploy_ops.outcome }}"
            echo "- smoke_status: ${{ steps.post_deploy_smoke.outcome }}"
            echo "- rollback_status: ${{ steps.rollback_backend.outcome }}"
            echo "- docker_prune_status: ${{ steps.prune_backend_images.outcome }}"
            if [ -f backend_ops.log ]; then
              echo "- ops_log: collected"
            fi
            if [ -f backend_smoke.log ]; then
              echo "- smoke_log: collected"
            fi
            if [ -f backend_docker_prune.log ]; then
              echo "- docker_prune_log: collected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend-patroni:
    if: ${{ vars.API_DB_HA_MODE == 'patroni' }}
    needs: release-gate
    permissions:
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/deploy-api-patroni.yml
    with:
      deploy_sha: ${{ needs.release-gate.outputs.deploy_sha }}
    secrets: inherit

  backend-release:
    if: ${{ always() && needs.release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - deploy-backend
      - deploy-backend-patroni
    outputs:
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      mode: ${{ steps.resolve.outputs.mode }}

    steps:
      - name: Require exactly one backend deployment path
        id: resolve
        env:
          PHYSICAL_RESULT: ${{ needs.deploy-backend.result }}
          PHYSICAL_IMAGE: ${{ needs.deploy-backend.outputs.backend_image }}
          PATRONI_RESULT: ${{ needs.deploy-backend-patroni.result }}
          PATRONI_IMAGE: ${{ needs.deploy-backend-patroni.outputs.backend_image }}
        run: |
          set -euo pipefail
          if [ "${PHYSICAL_RESULT}" = "success" ] && [ "${PATRONI_RESULT}" = "skipped" ]; then
            mode=physical
            backend_image="${PHYSICAL_IMAGE}"
          elif [ "${PHYSICAL_RESULT}" = "skipped" ] && [ "${PATRONI_RESULT}" = "success" ]; then
            mode=patroni
            backend_image="${PATRONI_IMAGE}"
          else
            echo "::error::Invalid backend paths: physical=${PHYSICAL_RESULT} patroni=${PATRONI_RESULT}"
            exit 1
          fi
          [[ "${backend_image}" =~ @sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Backend path did not produce an immutable digest"
            exit 1
          }
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${backend_image}" >> "$GITHUB_OUTPUT"
          echo "Backend release mode: ${mode}"

  # Standby deployment is isolated in a reusable workflow so the main release
  # file remains an orchestration surface.
  deploy-api-standby:
    if: ${{ always() && needs.backend-release.result == 'success' && needs.release-gate.result == 'success' && needs.backend-release.outputs.mode == 'physical' && vars.API_STANDBY_HOST != '' }}
    needs:
      - backend-release
      - release-gate
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: ./.github/workflows/deploy-api-standby.yml
    with:
      deploy_sha: ${{ needs.release-gate.outputs.deploy_sha }}
      backend_image: ${{ needs.backend-release.outputs.backend_image }}
    secrets: inherit

  # Web release is isolated in one reusable workflow so automatic releases and
  # manual catalog rebuilds use the same immutable artifact and promotion path.
  deploy-frontend:
    if: ${{ always() && needs.backend-release.result == 'success' && needs.detect-frontend-changes.result == 'success' && needs.release-gate.result == 'success' && needs.detect-frontend-changes.outputs.web_changed == 'true' }}
    needs:
      - backend-release
      - detect-frontend-changes
      - release-gate
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      deploy_sha: ${{ needs.release-gate.outputs.deploy_sha }}
    secrets: inherit
