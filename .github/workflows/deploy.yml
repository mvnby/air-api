name: Deploy to Production 🚀

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Secrets needed:
  # SSH_KEY (Private Key for root@api and user@web)
  # SSH_HOST_API (89.39.120.97)
  # SSH_HOST_WEB (178.159.240.174)
  # SSH_USER_API (root)
  # SSH_USER_WEB (user2154318)

jobs:
  # ======================================================
  # 1. BACKEND DEPLOYMENT (Docker -> mvn-api)
  # ======================================================
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Manager Frontend (Required for Backend Image)
        working-directory: ./manager_frontend
        run: |
          npm ci
          npm run build

      - name: Lowercase Repo Name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Backend (App + Bot)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ env.REPO }}/backend:latest
             ghcr.io/${{ env.REPO }}/backend:${{ github.sha }}

      # Diagnostic step: Check if API server is reachable
      - name: Test API Server Connectivity
        run: |
          echo "🔍 Testing connection to API server..."
          echo "Host: ${{ secrets.SSH_HOST_API }}"
          echo "User: ${{ secrets.SSH_USER_API }}"
          
          # Test if host is reachable (allow failure for diagnosis)
          ping -c 3 ${{ secrets.SSH_HOST_API }} || echo "⚠️ Ping failed, but SSH might still work"
          
          # Test if SSH port 22 is open
          nc -zv ${{ secrets.SSH_HOST_API }} 22 2>&1 || echo "⚠️ Port 22 check failed"
          
          echo "✅ Connectivity tests completed"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add server to known_hosts to avoid interactive prompt
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Deploy on API Server
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} << 'ENDSSH'
            cd ~/app
            
            echo "📥 Pulling latest Docker images..."
            docker compose pull
            
            echo "🔄 Restarting services..."
            docker compose up -d app bot
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment completed!"
          ENDSSH

  # ======================================================
  # 2. FRONTEND DEPLOYMENT (Static -> mvn-web)
  # ======================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend # Wait for API to be ready
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Astro Site
        working-directory: ./web
        env:
           # PRODUCTION API URL
           PUBLIC_API_URL: https://mvn.by/api/v1
        run: npm run build

      - name: Clean Remote Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_WEB }}
          username: ${{ secrets.SSH_USER_WEB }}
          key: ${{ secrets.SSH_KEY }}
          script: |
             # Clean the target directory before upload (optional but cleaner)
             # Adjust path based on where Nginx looks. Assuming ~/www/mvn or similar
             # rm -rf /var/www/mvn/dist/* 
             # For safety I will skip explicit rm -rf and trust rsync/scp to overwrite
             echo "Ready to receive files"

      - name: Upload Static Files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_WEB }}
          username: ${{ secrets.SSH_USER_WEB }}
          key: ${{ secrets.SSH_KEY }}
          source: "web/dist/*"
          target: "/var/www/user2154318/data/www/mvn.by"
          strip_components: 2 # strips 'web/dist', uploading contents directly
