name: Deploy to Production 🚀

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Secrets needed:
  # SSH_KEY (Private Key for root@api and user@web)
  # SSH_HOST_API (89.39.120.97)
  # SSH_HOST_WEB (178.159.240.174)
  # SSH_USER_API (root)
  # SSH_USER_WEB (user2154318)

jobs:
  # ======================================================
  # 1. BACKEND DEPLOYMENT (Docker -> mvn-api)
  # ======================================================
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Manager Frontend (Required for Backend Image)
        working-directory: ./manager_frontend
        run: |
          npm ci
          npm run build
          ls -la
          ls -la dist || echo "No dist folder found"

      - name: Lowercase Repo Name
        id: prep
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Backend (App + Bot) [Attempt 1]
        id: backend_push_1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      - name: Build and push Backend (App + Bot) [Attempt 2]
        id: backend_push_2
        if: steps.backend_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      - name: Build and push Backend (App + Bot) [Attempt 3]
        if: steps.backend_push_1.outcome == 'failure' && steps.backend_push_2.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      # Diagnostic step: Check if API server is reachable
      - name: Test API Server Connectivity
        run: |
          echo "🔍 Testing connection to API server..."
          echo "Host: ${{ secrets.SSH_HOST_API }}"
          echo "User: ${{ secrets.SSH_USER_API }}"
          
          # Test if host is reachable (allow failure for diagnosis)
          ping -c 3 ${{ secrets.SSH_HOST_API }} || echo "⚠️ Ping failed, but SSH might still work"
          
          # Test if SSH port 22 is open
          nc -zv ${{ secrets.SSH_HOST_API }} 22 2>&1 || echo "⚠️ Port 22 check failed"
          
          echo "✅ Connectivity tests completed"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add server to known_hosts to avoid interactive prompt
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Copy Compose Files to Server
        run: |
          scp -i ~/.ssh/deploy_key -v docker-compose.yml docker-compose.prod.yml ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}:/opt/air-api/


      - name: Deploy on API Server
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} << 'ENDSSH'
            cd /opt/air-api
            
            echo "📥 Pulling latest Docker images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "📦 Running database migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm app alembic upgrade head
            
            echo "🔄 Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app bot
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment completed!"
          ENDSSH

  # ======================================================
  # 2. FRONTEND DEPLOYMENT (Static -> mvn-web)
  # ======================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend # Wait for API to be ready
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Astro Site
        working-directory: ./web
        env:
           # SSR Build: Use production API for static generation
           INTERNAL_API_URL: https://api.mvn.by/api/v1
           # Client-side: Use production API  
           # CRITICAL: API Router prefix is /api, full path: https://api.mvn.by/api/v1
           PUBLIC_API_URL: https://api.mvn.by/api/v1
           # Google Tag Manager ID
           PUBLIC_GTM_ID: GTM-5CR6WBBC
        run: npm run build

      - name: Setup SSH Key for Web Server
        run: |
          mkdir -p ~/.ssh
          
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::SSH_KEY secret is missing or empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.SSH_HOST_WEB }}" ]; then
            echo "::error::SSH_HOST_WEB secret is missing or empty"
            exit 1
          fi

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "Scanning host: ${{ secrets.SSH_HOST_WEB }}"
          ssh-keyscan -v -H ${{ secrets.SSH_HOST_WEB }} >> ~/.ssh/known_hosts 2> ssh_scan_error.log || cat ssh_scan_error.log
          
          if [ ! -s ~/.ssh/known_hosts ]; then
             echo "::error::known_hosts file is empty. ssh-keyscan failed."
             cat ssh_scan_error.log
             exit 1
          fi

      - name: Deploy to Web Server
        run: |
          # Upload files using rsync over SSH
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            web/dist/ \
            ${{ secrets.SSH_USER_WEB }}@${{ secrets.SSH_HOST_WEB }}:/var/www/user2154318/data/www/mvn.by/
          
          echo "✅ Frontend deployment completed!"
