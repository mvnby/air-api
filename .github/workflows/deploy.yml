name: Deploy to Production 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Run frontend deployment after backend"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Secrets needed:
  # SSH_KEY (Private Key for root@api and user@web)
  # SSH_HOST_API (89.39.120.97)
  # SSH_HOST_WEB (178.159.240.174)
  # SSH_USER_API (root)
  # SSH_USER_WEB (user2154318)

jobs:
  # ======================================================
  # 1. BACKEND DEPLOYMENT (Docker -> mvn-api)
  # ======================================================
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Manager Frontend (Required for Backend Image)
        working-directory: ./manager_frontend
        env:
          WEBSITE_URL: https://mvn.by
        run: |
          npm ci
          npm run build

      - name: Lowercase Repo Name
        id: prep
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Backend (App + Bot) [Attempt 1]
        id: backend_push_1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      - name: Build and push Backend (App + Bot) [Attempt 2]
        id: backend_push_2
        if: steps.backend_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      - name: Build and push Backend (App + Bot) [Attempt 3]
        id: backend_push_3
        if: steps.backend_push_1.outcome == 'failure' && steps.backend_push_2.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      # Diagnostic step: Check if API server is reachable
      - name: Test API Server Connectivity
        run: |
          echo "🔍 Testing connection to API server..."
          echo "Host: ${{ secrets.SSH_HOST_API }}"
          echo "User: ${{ secrets.SSH_USER_API }}"
          
          # Test if host is reachable (allow failure for diagnosis)
          ping -c 3 ${{ secrets.SSH_HOST_API }} || echo "⚠️ Ping failed, but SSH might still work"
          
          # Test if SSH port 22 is open
          nc -zv ${{ secrets.SSH_HOST_API }} 22 2>&1 || echo "⚠️ Port 22 check failed"
          
          echo "✅ Connectivity tests completed"

      - name: Validate API SSH Reachability (Required)
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SSH_HOST_API }}" ] || [ -z "${{ secrets.SSH_USER_API }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing one of required secrets: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi

          echo "🔐 Validating SSH port reachability for ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}..."
          if ! nc -z -w 10 ${{ secrets.SSH_HOST_API }} 22; then
            echo "::error::SSH port 22 is unreachable for API host. Check host/network/firewall before deploy."
            exit 1
          fi
          echo "✅ SSH port is reachable"

      - name: Copy Compose Files and Scripts to Server
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts
          
          # Copy compose files to project dir (requires write access)
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -v docker-compose.prod.yml \
            ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}:/opt/air-api/
          
      - name: Execute Deployment Script
        id: deploy_backend
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v"

          # Transfer script via pipe to avoid SCP issues
          cat scripts/deploy.sh | ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cat > /tmp/deploy.sh"
          
          # Execute script
          ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "chmod +x /tmp/deploy.sh && GHCR_PAT='${{ secrets.GHCR_PAT }}' GITHUB_ACTOR='${{ github.actor }}' bash /tmp/deploy.sh"

      - name: Optional Post-Deploy Backend Ops
        id: post_deploy_ops
        env:
          RUN_POST_DEPLOY_OPS: ${{ secrets.RUN_POST_DEPLOY_OPS }}
          OPS_MODE: ${{ secrets.OPS_MODE }}
          RUN_NORMALIZE_LEGACY: ${{ secrets.RUN_NORMALIZE_LEGACY }}
          HIDE_LEGACY_GROUPS: ${{ secrets.HIDE_LEGACY_GROUPS }}
          RUN_REPORT_LEGACY_LINKS: ${{ secrets.RUN_REPORT_LEGACY_LINKS }}
          RUN_CLEANUP_LEGACY_LINKS: ${{ secrets.RUN_CLEANUP_LEGACY_LINKS }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v"
          : "${RUN_POST_DEPLOY_OPS:=true}"
          : "${OPS_MODE:=report_only}"
          : "${RUN_NORMALIZE_LEGACY:=false}"
          : "${RUN_REPORT_LEGACY_LINKS:=true}"
          : "${RUN_CLEANUP_LEGACY_LINKS:=false}"
          : "${DRY_RUN:=true}"

          cat scripts/ops_post_deploy.sh | ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cat > /tmp/ops_post_deploy.sh"

          ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "\
            chmod +x /tmp/ops_post_deploy.sh && \
            RUN_POST_DEPLOY_OPS='${RUN_POST_DEPLOY_OPS}' \
            OPS_MODE='${OPS_MODE}' \
            RUN_NORMALIZE_LEGACY='${RUN_NORMALIZE_LEGACY}' \
            HIDE_LEGACY_GROUPS='${HIDE_LEGACY_GROUPS}' \
            RUN_REPORT_LEGACY_LINKS='${RUN_REPORT_LEGACY_LINKS}' \
            RUN_CLEANUP_LEGACY_LINKS='${RUN_CLEANUP_LEGACY_LINKS}' \
            DRY_RUN='${DRY_RUN}' \
            OPS_SUMMARY_FILE='/tmp/ops_summary.txt' \
            bash /tmp/ops_post_deploy.sh && cat /tmp/ops_summary.txt" | tee backend_ops.log

      - name: Post-Deploy Smoke Check
        id: post_deploy_smoke
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v"
          cat scripts/post_deploy_smoke_check.sh | ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cat > /tmp/post_deploy_smoke_check.sh"
          ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "\
            chmod +x /tmp/post_deploy_smoke_check.sh && \
            BASE_URL='http://localhost:8000' \
            SMOKE_SUMMARY_FILE='/tmp/smoke_summary.txt' \
            bash /tmp/post_deploy_smoke_check.sh && cat /tmp/smoke_summary.txt" | tee backend_smoke.log

      - name: Upload Backend Ops Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ops-logs-${{ github.run_id }}
          path: |
            backend_ops.log
            backend_smoke.log
          if-no-files-found: warn

      - name: Backend Deploy Summary
        if: always()
        run: |
          digest="${{ steps.backend_push_1.outputs.digest }}"
          if [ -z "$digest" ] && [ "${{ steps.backend_push_2.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_2.outputs.digest }}"
          fi
          if [ -z "$digest" ] && [ "${{ steps.backend_push_3.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_3.outputs.digest }}"
          fi
          if [ -z "$digest" ]; then
            digest="n/a"
          fi
          {
            echo "## Backend Deploy Summary"
            echo "- image: ghcr.io/${{ steps.prep.outputs.repo }}/backend"
            echo "- digest: ${digest}"
            echo "- commit_sha: ${{ github.sha }}"
            echo "- deploy_status: ${{ steps.deploy_backend.outcome }}"
            echo "- ops_status: ${{ steps.post_deploy_ops.outcome }}"
            echo "- smoke_status: ${{ steps.post_deploy_smoke.outcome }}"
            if [ -f backend_ops.log ]; then
              echo "- ops_log: collected"
            fi
            if [ -f backend_smoke.log ]; then
              echo "- smoke_log: collected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ======================================================
  # 2. FRONTEND DEPLOYMENT (Static -> mvn-web)
  # ======================================================
  deploy-frontend:
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_frontend == 'true' }}
    runs-on: ubuntu-latest
    needs: deploy-backend # Wait for API to be ready
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Astro Site
        working-directory: ./web
        env:
           # SSR Build: Use production API for static generation
           INTERNAL_API_URL: https://api.mvn.by/api/v1
           # Client-side: Use production API  
           # CRITICAL: API Router prefix is /api, full path: https://api.mvn.by/api/v1
           PUBLIC_API_URL: https://api.mvn.by/api/v1
           # Google Tag Manager ID
           PUBLIC_GTM_ID: GTM-5CR6WBBC
        run: npm run build

      - name: Setup SSH Key for Web Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_WEB }} >> ~/.ssh/known_hosts || true

      - name: Deploy to Web Server
        run: |
          # Upload files using rsync over SSH with retries
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ConnectionAttempts=10" \
            web/dist/ \
            ${{ secrets.SSH_USER_WEB }}@${{ secrets.SSH_HOST_WEB }}:/var/www/user2154318/data/www/mvn.by/
          
          echo "✅ Frontend deployment completed!"
