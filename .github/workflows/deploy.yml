name: Deploy to Production 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Run frontend deployment after backend"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Secrets needed:
  # SSH_KEY (Private Key for root@api and user@web)
  # SSH_HOST_API (185.250.45.54)
  # SSH_HOST_WEB (178.159.240.174)
  # SSH_USER_API (root)
  # SSH_USER_WEB (user2154318)

jobs:
  # ======================================================
  # 0. FRONTEND CHANGE DETECTION
  # ======================================================
  detect-frontend-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web_changed: ${{ steps.detect.outputs.web_changed }}
      reason: ${{ steps.detect.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect storefront-relevant changes
        id: detect
        run: |
          set -euo pipefail

          web_changed=false
          reason="no storefront-relevant changes detected"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deploy_frontend }}" = "true" ]; then
              web_changed=true
              reason="manual dispatch requested deploy_frontend=true"
            else
              reason="manual dispatch did not request frontend deploy"
            fi
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            zero_sha="0000000000000000000000000000000000000000"

            if [ "${before}" = "${zero_sha}" ]; then
              web_changed=true
              reason="first push has no reliable before SHA; deploying frontend conservatively"
            else
              if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "${before}" || true
              fi

              if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
                web_changed=true
                reason="before SHA is unavailable locally; deploying frontend conservatively"
              elif git diff --name-only "${before}" "${after}" | grep -E '^(web/|\.github/workflows/(deploy|rebuild-web|check-web-ssh)\.yml$)' >/dev/null; then
                web_changed=true
                reason="storefront-relevant files changed"
              fi
            fi
          fi

          echo "web_changed=${web_changed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

          {
            echo "## Frontend Deploy Decision"
            echo "- web_changed: ${web_changed}"
            echo "- reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-deploy-decision:
    runs-on: ubuntu-latest
    needs: detect-frontend-changes
    steps:
      - name: Report frontend deploy decision
        run: |
          {
            echo "## Frontend Deploy Decision"
            echo "- web_changed: ${{ needs.detect-frontend-changes.outputs.web_changed }}"
            echo "- reason: ${{ needs.detect-frontend-changes.outputs.reason }}"
            if [ "${{ needs.detect-frontend-changes.outputs.web_changed }}" != "true" ]; then
              echo "- result: deploy-frontend will be skipped; backend deploy can still make this workflow green"
            else
              echo "- result: deploy-frontend is eligible to run after backend deploy"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ======================================================
  # 1. BACKEND DEPLOYMENT (Docker -> mvn-api)
  # ======================================================
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Manager Frontend (Required for Backend Image)
        working-directory: ./manager_frontend
        env:
          WEBSITE_URL: https://mvn.by
        run: |
          npm ci
          npm run build

      - name: Lowercase Repo Name
        id: prep
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Backend (App + Bot) [Attempt 1]
        id: backend_push_1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      - name: Build and push Backend (App + Bot) [Attempt 2]
        id: backend_push_2
        if: steps.backend_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      - name: Build and push Backend (App + Bot) [Attempt 3]
        id: backend_push_3
        if: steps.backend_push_1.outcome == 'failure' && steps.backend_push_2.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:latest
             ghcr.io/${{ steps.prep.outputs.repo }}/backend:${{ github.sha }}

      # Diagnostic step: Check if API server is reachable
      - name: Test API Server Connectivity
        run: |
          echo "🔍 Testing connection to API server..."
          echo "Host: ${{ secrets.SSH_HOST_API }}"
          echo "User: ${{ secrets.SSH_USER_API }}"
          
          # Test if host is reachable (allow failure for diagnosis)
          ping -c 3 ${{ secrets.SSH_HOST_API }} || echo "⚠️ Ping failed, but SSH might still work"
          
          # Test if SSH port 22 is open
          nc -zv ${{ secrets.SSH_HOST_API }} 22 2>&1 || echo "⚠️ Port 22 check failed"
          
          echo "✅ Connectivity tests completed"

      - name: Validate API SSH Reachability (Required)
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SSH_HOST_API }}" ] || [ -z "${{ secrets.SSH_USER_API }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing one of required secrets: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi

          echo "🔐 Validating SSH port reachability for ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}..."
          if ! nc -z -w 10 ${{ secrets.SSH_HOST_API }} 22; then
            echo "::error::SSH port 22 is unreachable for API host. Check host/network/firewall before deploy."
            exit 1
          fi
          echo "✅ SSH port is reachable"

      - name: Copy Compose Files and Scripts to Server
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts
          
          # Copy compose files to project dir (requires write access)
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -v docker-compose.prod.yml \
            ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}:/opt/air-api/
          
      - name: Execute Deployment Script
        id: deploy_backend
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v"

          # Transfer script via pipe to avoid SCP issues
          cat scripts/deploy.sh | ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cat > /tmp/deploy.sh"
          
          # Execute script
          ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "chmod +x /tmp/deploy.sh && GHCR_PAT='${{ secrets.GHCR_PAT }}' GITHUB_ACTOR='${{ github.actor }}' bash /tmp/deploy.sh"

      - name: Optional Post-Deploy Backend Ops
        id: post_deploy_ops
        continue-on-error: true
        env:
          RUN_POST_DEPLOY_OPS: ${{ secrets.RUN_POST_DEPLOY_OPS }}
          OPS_MODE: ${{ secrets.OPS_MODE }}
          RUN_NORMALIZE_LEGACY: ${{ secrets.RUN_NORMALIZE_LEGACY }}
          RUN_BACKFILL_BRAND_SERIES: ${{ secrets.RUN_BACKFILL_BRAND_SERIES }}
          RUN_SAFE_BRAND_CLEANUP: ${{ secrets.RUN_SAFE_BRAND_CLEANUP }}
          HIDE_LEGACY_GROUPS: ${{ secrets.HIDE_LEGACY_GROUPS }}
          RUN_REPORT_LEGACY_LINKS: ${{ secrets.RUN_REPORT_LEGACY_LINKS }}
          RUN_CLEANUP_LEGACY_LINKS: ${{ secrets.RUN_CLEANUP_LEGACY_LINKS }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v"
          : "${RUN_POST_DEPLOY_OPS:=true}"
          : "${OPS_MODE:=report_only}"
          : "${RUN_NORMALIZE_LEGACY:=false}"
          : "${RUN_BACKFILL_BRAND_SERIES:=false}"
          : "${RUN_SAFE_BRAND_CLEANUP:=false}"
          : "${RUN_REPORT_LEGACY_LINKS:=true}"
          : "${RUN_CLEANUP_LEGACY_LINKS:=false}"
          : "${DRY_RUN:=true}"

          cat scripts/ops_post_deploy.sh | ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cat > /tmp/ops_post_deploy.sh"

          ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "\
            chmod +x /tmp/ops_post_deploy.sh && \
            RUN_POST_DEPLOY_OPS='${RUN_POST_DEPLOY_OPS}' \
            OPS_MODE='${OPS_MODE}' \
            RUN_NORMALIZE_LEGACY='${RUN_NORMALIZE_LEGACY}' \
            RUN_BACKFILL_BRAND_SERIES='${RUN_BACKFILL_BRAND_SERIES}' \
            RUN_SAFE_BRAND_CLEANUP='${RUN_SAFE_BRAND_CLEANUP}' \
            HIDE_LEGACY_GROUPS='${HIDE_LEGACY_GROUPS}' \
            RUN_REPORT_LEGACY_LINKS='${RUN_REPORT_LEGACY_LINKS}' \
            RUN_CLEANUP_LEGACY_LINKS='${RUN_CLEANUP_LEGACY_LINKS}' \
            DRY_RUN='${DRY_RUN}' \
            OPS_SUMMARY_FILE='/tmp/ops_summary.txt' \
            bash /tmp/ops_post_deploy.sh && cat /tmp/ops_summary.txt" | tee backend_ops.log

      - name: Post-Deploy Smoke Check
        id: post_deploy_smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -v"
          cat scripts/post_deploy_smoke_check.sh | ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cat > /tmp/post_deploy_smoke_check.sh"
          ssh ${SSH_OPTS} ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "\
            chmod +x /tmp/post_deploy_smoke_check.sh && \
            BASE_URL='http://localhost:8000' \
            SMOKE_SUMMARY_FILE='/tmp/smoke_summary.txt' \
            bash /tmp/post_deploy_smoke_check.sh && cat /tmp/smoke_summary.txt" | tee backend_smoke.log

      - name: Upload Backend Ops Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ops-logs-${{ github.run_id }}
          path: |
            backend_ops.log
            backend_smoke.log
          if-no-files-found: warn

      - name: Backend Deploy Summary
        if: always()
        run: |
          digest="${{ steps.backend_push_1.outputs.digest }}"
          if [ -z "$digest" ] && [ "${{ steps.backend_push_2.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_2.outputs.digest }}"
          fi
          if [ -z "$digest" ] && [ "${{ steps.backend_push_3.outcome }}" = "success" ]; then
            digest="${{ steps.backend_push_3.outputs.digest }}"
          fi
          if [ -z "$digest" ]; then
            digest="n/a"
          fi
          {
            echo "## Backend Deploy Summary"
            echo "- image: ghcr.io/${{ steps.prep.outputs.repo }}/backend"
            echo "- digest: ${digest}"
            echo "- commit_sha: ${{ github.sha }}"
            echo "- deploy_status: ${{ steps.deploy_backend.outcome }}"
            echo "- ops_status: ${{ steps.post_deploy_ops.outcome }}"
            echo "- smoke_status: ${{ steps.post_deploy_smoke.outcome }}"
            if [ -f backend_ops.log ]; then
              echo "- ops_log: collected"
            fi
            if [ -f backend_smoke.log ]; then
              echo "- smoke_log: collected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ======================================================
  # 2. FRONTEND DEPLOYMENT (Static -> mvn-web)
  # ======================================================
  deploy-frontend:
    if: ${{ needs.detect-frontend-changes.outputs.web_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - deploy-backend # Wait for API to be ready
      - detect-frontend-changes
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Astro Site
        working-directory: ./web
        env:
           # SSR Build: bypass public CDN/WAF checks via SSH tunnel to the API host.
           INTERNAL_API_URL: http://127.0.0.1:18000/api/v1
           # Client-side: Use production API  
           # CRITICAL: API Router prefix is /api, full path: https://api.mvn.by/api/v1
           PUBLIC_API_URL: https://api.mvn.by/api/v1
           # Google Tag Manager ID
           PUBLIC_GTM_ID: GTM-5CR6WBBC
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts
          ssh -f -N \
            -L 18000:127.0.0.1:8000 \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=20 \
            ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }}
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:18000/api/v1/config >/dev/null
          npm run build

      - name: Setup SSH Key for Web Server
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST_WEB }} >> ~/.ssh/known_hosts || true

      - name: Deploy to Web Server
        run: |
          set -euo pipefail

          WEB_HOST="${{ secrets.SSH_HOST_WEB }}"
          WEB_USER="${{ secrets.SSH_USER_WEB }}"
          WEB_TARGET="/var/www/${{ secrets.SSH_USER_WEB }}/data/www/mvn.by/"
          SSH_OPTS="-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"
          MAX_ATTEMPTS=5
          PORT_FAILURES=0
          LOGIN_FAILURES=0
          RSYNC_FAILURES=0

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "🚀 Frontend deploy attempt ${attempt}/${MAX_ATTEMPTS}"

            if nc -z -w 10 "${WEB_HOST}" 22; then
              echo "✅ Web SSH port is reachable"
            else
              PORT_FAILURES=$((PORT_FAILURES + 1))
              echo "::warning::Web SSH port 22 is not reachable before rsync attempt ${attempt}"
            fi

            if ssh ${SSH_OPTS} "${WEB_USER}@${WEB_HOST}" "true"; then
              if rsync -avz --delete \
                -e "ssh ${SSH_OPTS}" \
                web/dist/ \
                "${WEB_USER}@${WEB_HOST}:${WEB_TARGET}"; then
                echo "✅ Frontend deployment completed on attempt ${attempt}!"
                {
                  echo "## Frontend Deploy Summary"
                  echo "- job: deploy-frontend"
                  echo "- target: ${WEB_USER}@${WEB_HOST}:${WEB_TARGET}"
                  echo "- attempts_used: ${attempt}"
                  echo "- status: success"
                  echo "- backend_dependency: deploy-backend completed before frontend deploy"
                  echo "- build_status: success"
                  echo "- failure_kind: n/a"
                  echo "- ssh_port_failures: ${PORT_FAILURES}"
                  echo "- ssh_login_failures: ${LOGIN_FAILURES}"
                  echo "- rsync_failures: ${RSYNC_FAILURES}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              RSYNC_FAILURES=$((RSYNC_FAILURES + 1))
              echo "::warning::rsync failed on attempt ${attempt}"
            else
              LOGIN_FAILURES=$((LOGIN_FAILURES + 1))
              echo "::warning::SSH login preflight failed on attempt ${attempt}"
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep_seconds=$((attempt * 20))
              echo "⏳ Waiting ${sleep_seconds}s before retry..."
              sleep "${sleep_seconds}"
            fi
          done

          if [ "${PORT_FAILURES}" -gt 0 ] || [ "${LOGIN_FAILURES}" -gt 0 ]; then
            FAILURE_KIND="web_ssh_connectivity"
          elif [ "${RSYNC_FAILURES}" -gt 0 ]; then
            FAILURE_KIND="rsync_transfer"
          else
            FAILURE_KIND="unknown"
          fi

          {
            echo "## Frontend Deploy Summary"
            echo "- job: deploy-frontend"
            echo "- target: ${WEB_USER}@${WEB_HOST}:${WEB_TARGET}"
            echo "- attempts_used: ${MAX_ATTEMPTS}"
            echo "- status: failed"
            echo "- backend_dependency: deploy-backend completed before frontend deploy"
            echo "- build_status: success"
            echo "- failure_kind: ${FAILURE_KIND}"
            echo "- ssh_port_failures: ${PORT_FAILURES}"
            echo "- ssh_login_failures: ${LOGIN_FAILURES}"
            echo "- rsync_failures: ${RSYNC_FAILURES}"
            echo "- next_step: run the manual Web SSH Connectivity Check workflow or choose a more reliable web deploy architecture"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Frontend deployment failed after ${MAX_ATTEMPTS} attempts (${FAILURE_KIND}). Backend deploy/smoke already completed; this failure is scoped to the web deploy path."
          exit 1
