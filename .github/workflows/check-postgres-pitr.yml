name: PostgreSQL PITR Check

on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:
    inputs:
      required:
        description: "Run the strict PITR proof"
        type: boolean
        required: false
        default: true

concurrency:
  group: postgres-pitr-host-operations
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PITR_CHECK_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.required) || vars.POSTGRES_PITR_REQUIRED || 'false' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Require Reviewed Main Ref
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Secret-bearing PITR workflows run only from refs/heads/main"
            exit 64
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Decide Whether To Run
        id: gate
        run: |
          set -euo pipefail
          case "${PITR_CHECK_REQUIRED}" in
            true)
              echo "run=true" >> "${GITHUB_OUTPUT}"
              ;;
            false)
              echo "run=false" >> "${GITHUB_OUTPUT}"
              printf '%s\n' "Strict PITR check skipped because POSTGRES_PITR_REQUIRED is false." \
                | tee postgres-pitr-check.log
              ;;
            *)
              echo "::error::POSTGRES_PITR_REQUIRED must be exactly true or false"
              exit 64
              ;;
          esac

      - name: Run PostgreSQL PITR Check
        if: steps.gate.outputs.run == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing required SSH_KEY secret"
            exit 1
          fi
          ssh_identity="${SSH_KEY}"
          unset SSH_KEY
          trap 'ssh_identity=' EXIT
          printf '%s\n' "${ssh_identity}" \
            | python3 -I scripts/ha/run_postgres_pitr_workflow.py --phase verify 2>&1 \
            | tee postgres-pitr-check.log

      - name: Write Summary
        if: always()
        run: |
          {
            echo "## PostgreSQL PITR Check"
            echo "- strict_required: ${PITR_CHECK_REQUIRED}"
            echo "- ran: ${{ steps.gate.outputs.run || 'false' }}"
            echo "- topology: pinned mvn-api + zakup Patroni cluster"
            echo "- max_wal_age_minutes: 180 (installed strict runner)"
            echo "- max_basebackup_age_hours: 30 (installed strict runner)"
            echo "- log_artifact: postgres-pitr-check-log-${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload PITR Check Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-pitr-check-log-${{ github.run_id }}
          path: postgres-pitr-check.log
          if-no-files-found: warn

      - name: Notify HA failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "MVN PostgreSQL PITR check failed"
          details: "Artifact: postgres-pitr-check-log-${{ github.run_id }}"
