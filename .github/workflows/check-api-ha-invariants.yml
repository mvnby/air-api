name: API HA Invariant Check

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      primary_origin:
        description: "Current primary origin IP"
        type: string
        required: false
        default: ""
      standby_origin:
        description: "Current standby origin IP"
        type: string
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup API SSH Key
        if: ${{ (vars.API_DB_HA_MODE || 'physical') == 'patroni' }}
        env:
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST_API}" ] || [ -z "${SSH_USER_API}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing one of required secrets: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/api_ha_invariant_key
          chmod 600 ~/.ssh/api_ha_invariant_key
          ssh-keyscan -T 10 -H "${PATRONI_MVN_API_HOST}" >> ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "${PATRONI_ZAKUP_HOST}" >> ~/.ssh/known_hosts

      - name: Detect official Patroni maintenance
        id: maintenance
        if: ${{ (vars.API_DB_HA_MODE || 'physical') == 'patroni' }}
        env:
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          API_STANDBY_USER: ${{ vars.API_STANDBY_USER || secrets.SSH_USER_API }}
          PATRONI_MVN_API_HOST: ${{ vars.PATRONI_MVN_API_HOST || '185.250.45.54' }}
          PATRONI_ZAKUP_HOST: ${{ vars.PATRONI_ZAKUP_HOST || '193.47.42.213' }}
        run: |
          set -euo pipefail
          export SSH_OPTS="-i ~/.ssh/api_ha_invariant_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          export API_NODE_SSH="${SSH_USER_API}@${PATRONI_MVN_API_HOST}"
          export RESERVE_NODE_SSH="${API_STANDBY_USER}@${PATRONI_ZAKUP_HOST}"
          export API_NODE_PROJECT_DIR="/opt/air-api"
          export RESERVE_NODE_PROJECT_DIR="/opt/mvn-reserve"
          python3 scripts/ha/check_patroni_maintenance.py \
            --github-output "${GITHUB_OUTPUT}" 2>&1 | tee api-ha-invariant.log

      - name: Run active-passive invariant check
        if: steps.maintenance.outputs.active != 'true'
        env:
          API_HOST: api.mvn.by
          PUBLIC_BASE_URL: https://api.mvn.by
          PRIMARY_ORIGIN: ${{ github.event.inputs.primary_origin || vars.API_PRIMARY_ORIGIN || '185.250.45.54' }}
          STANDBY_ORIGIN: ${{ github.event.inputs.standby_origin || vars.API_STANDBY_ORIGIN || '193.47.42.213' }}
          PRIMARY_ROLE: primary
          STANDBY_ROLE: standby
          DISCOVER_PRIMARY_FROM_READY: ${{ vars.API_DB_HA_MODE == 'patroni' && 'true' || 'false' }}
          CHECK_PUBLIC_READY: "false"
        run: bash scripts/ha/check_active_passive.sh | tee -a api-ha-invariant.log

      - name: Upload HA invariant log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-ha-invariant-log-${{ github.run_id }}
          path: api-ha-invariant.log
          if-no-files-found: warn

      - name: Notify HA failure
        if: failure()
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "MVN API HA invariant check failed"
          details: "Artifact: api-ha-invariant-log-${{ github.run_id }}"
