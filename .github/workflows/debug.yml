name: Test Google API 🔐

on: [workflow_dispatch]

jobs:
  test-google:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Run Google Diagnostic
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} << 'ENDSSH'
            cd /opt/air-api
            echo "🧪 Starting diagnostic..."
            
            # Use heredoc to send script into the container
            docker compose -f docker-compose.prod.yml exec -T app python3 << 'ENDPYTHON'
try:
    import os
    from services.google_service import google_service
    
    print('✅ Python Environment: OK')
    
    # Check physical files
    files = ['token.json', 'client_secret.json', 'credentials.json']
    for f in files:
        exists = os.path.exists(f)
        status = '✅' if exists else '❌'
        print(f'{status} File {f} exists in container')

    # Check logic
    status = google_service.get_token_status()
    print(f'📊 Token Status Detailed: {status}')
    
    if status.get("valid"):
        print("🚀 RESULT: GOOGLE API INTEGRATION IS FULLY FUNCTIONAL")
    elif status.get("exists") and not status.get("expired"):
         print("🚀 RESULT: GOOGLE API INTEGRATION IS WORKING (token exists and not expired)")
    else:
        print("⚠️ RESULT: GOOGLE API MAY NEED RE-AUTHENTICATION")
        
except Exception as e:
    print(f'💥 DIAGNOSTIC CRASHED: {str(e)}')
    import traceback
    traceback.print_exc()
ENDPYTHON
          ENDSSH
