name: Debug Production 🕵️‍♂️

on: [workflow_dispatch]

jobs:
  debug-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Fetch Docker Logs
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} << 'ENDSSH'
            cd /opt/air-api
            echo "🐳 Docker PS:"
            docker ps -a
            
            echo "\n📄 App Logs (Last 100 lines):"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=100 app

            echo "\n🤖 Bot Logs (Last 50 lines):"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 bot
          ENDSSH
