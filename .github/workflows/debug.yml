name: Debug Production 🕵️‍♂️ (Disk Analysis)

on: [workflow_dispatch]

jobs:
  analyze-disk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Analyze Disk Usage
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} << 'ENDSSH'
            echo "📂 --- List of files in /opt/air-api (recursive) ---"
            ls -laR /opt/air-api
            
            echo "\n📊 --- Disk usage in /opt/air-api ---"
            du -sh /opt/air-api/*
            
            echo "\n🔝 --- Top 20 largest files/dirs on system ---"
            du -ahx / | sort -rh | head -n 20
          ENDSSH
