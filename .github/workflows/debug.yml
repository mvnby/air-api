name: Debug Production 🕵️‍♂️

on: [workflow_dispatch]

jobs:
  debug-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Prune and Check Disk
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} << 'ENDSSH'
            echo "💾 Disk Usage Before:"
            df -h
            
            echo "🧹 Pruning Docker System..."
            # Force prune of all unused images, containers, networks
            docker system prune -af
            
            echo "💾 Disk Usage After:"
            df -h
          ENDSSH
