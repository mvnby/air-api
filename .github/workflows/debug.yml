name: Test Google API 🔐

on: [workflow_dispatch]

jobs:
  test-google:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_API }} >> ~/.ssh/known_hosts

      - name: Run Google Diagnostic
        run: |
          ssh -i ~/.ssh/deploy_key -v ${{ secrets.SSH_USER_API }}@${{ secrets.SSH_HOST_API }} "cd /opt/air-api && docker compose -f docker-compose.prod.yml exec -T app python3 -c \"import os; from services.google_service import google_service; print('---'); print('✅ Python Import: SUCCESS'); print('🔍 token.json:', os.path.exists('token.json')); print('🔍 client_secret.json:', os.path.exists('client_secret.json')); print('🔍 credentials.json:', os.path.exists('credentials.json')); status = google_service.get_token_status(); print('📊 Detailed Status:', status); print('🚀 FINAL RESULT:', 'WORKING' if status.get('valid') or (status.get('exists') and not status.get('expired')) else 'RE-AUTH NEEDED')\""
