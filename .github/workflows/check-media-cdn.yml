name: Media CDN Check

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      products_url:
        description: "Public products API URL to sample"
        type: string
        required: false
        default: "https://api.mvn.by/api/v1/products?limit=5"
      expected_cdn_base:
        description: "Expected CDN URL prefix"
        type: string
        required: false
        default: "https://cdn.mvn.by"
      min_cdn_urls:
        description: "Minimum primary image CDN URLs"
        type: string
        required: false
        default: "3"
      min_db_cdn_urls:
        description: "Minimum DB-backed object-storage CDN URLs"
        type: string
        required: false
        default: "3"
      min_db_cdn_urls_by_source:
        description: "Per-source DB CDN thresholds, comma-separated source=count"
        type: string
        required: false
        default: "product_image_variant=1,media_asset=1,order_technical_meta=1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run media CDN check
        env:
          PRODUCTS_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.products_url || 'https://api.mvn.by/api/v1/products?limit=5' }}
          EXPECTED_CDN_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_cdn_base || 'https://cdn.mvn.by' }}
          MIN_CDN_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_cdn_urls || '3' }}
        run: |
          set -euo pipefail
          python3 scripts/check_media_cdn_public.py \
            --products-url "${PRODUCTS_URL}" \
            --expected-cdn-base "${EXPECTED_CDN_BASE}" \
            --min-cdn-urls "${MIN_CDN_URLS}" \
            --max-fetches 5 \
            2>&1 \
            | tee media-cdn-check.log

      - name: Setup API SSH Key
        env:
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST_API}" ] || [ -z "${SSH_USER_API}" ] || [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing one of required secrets: SSH_HOST_API, SSH_USER_API, SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/media_cdn_key
          chmod 600 ~/.ssh/media_cdn_key
          ssh-keyscan -T 10 -H "${SSH_HOST_API}" >> ~/.ssh/known_hosts

      - name: Run DB-backed media CDN check
        env:
          SSH_HOST_API: ${{ secrets.SSH_HOST_API }}
          SSH_USER_API: ${{ secrets.SSH_USER_API }}
          API_PROJECT_DIR: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}
          API_COMPOSE_FILE: ${{ vars.API_COMPOSE_FILE || 'docker-compose.prod.yml' }}
          EXPECTED_CDN_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_cdn_base || 'https://cdn.mvn.by' }}
          MIN_DB_CDN_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_db_cdn_urls || '3' }}
          MIN_DB_CDN_URLS_BY_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.min_db_cdn_urls_by_source || 'product_image_variant=1,media_asset=1,order_technical_meta=1' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/media_cdn_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          quote() {
            printf '%q' "$1"
          }

          ssh ${SSH_OPTS} "${SSH_USER_API}@${SSH_HOST_API}" "\
            set -euo pipefail && \
            cd $(quote "${API_PROJECT_DIR}") && \
            active_service=app && \
            if [ -f .active-api-slot ]; then \
              active_slot=\$(tr -d '\\r\\n' < .active-api-slot); \
              case \"\${active_slot}\" in \
                blue|green) active_service=app-\${active_slot} ;; \
                *) echo 'invalid active API slot' >&2; exit 1 ;; \
              esac; \
            fi && \
            docker compose -f $(quote "${API_COMPOSE_FILE}") --profile bluegreen exec -T \"\${active_service}\" \
              python3 scripts/check_media_cdn_db_urls.py \
                --expected-cdn-base $(quote "${EXPECTED_CDN_BASE}") \
                --min-db-cdn-urls $(quote "${MIN_DB_CDN_URLS}") \
                --min-db-cdn-urls-by-source $(quote "${MIN_DB_CDN_URLS_BY_SOURCE}") \
                --max-fetches 10" \
            2>&1 \
            | tee -a media-cdn-check.log

      - name: Write Summary
        if: always()
        run: |
          {
            echo "## Media CDN Check"
            echo "- products_url: ${{ github.event_name == 'workflow_dispatch' && inputs.products_url || 'https://api.mvn.by/api/v1/products?limit=5' }}"
            echo "- expected_cdn_base: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_cdn_base || 'https://cdn.mvn.by' }}"
            echo "- min_cdn_urls: ${{ github.event_name == 'workflow_dispatch' && inputs.min_cdn_urls || '3' }}"
            echo "- min_db_cdn_urls: ${{ github.event_name == 'workflow_dispatch' && inputs.min_db_cdn_urls || '3' }}"
            echo "- min_db_cdn_urls_by_source: ${{ github.event_name == 'workflow_dispatch' && inputs.min_db_cdn_urls_by_source || 'product_image_variant=1,media_asset=1,order_technical_meta=1' }}"
            echo "- api_project_dir: ${{ vars.API_PROJECT_DIR || '/opt/air-api' }}"
            echo "- api_compose_file: ${{ vars.API_COMPOSE_FILE || 'docker-compose.prod.yml' }}"
            echo "- log_artifact: media-cdn-check-log-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload media CDN log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-cdn-check-log-${{ github.run_id }}
          path: media-cdn-check.log
          if-no-files-found: warn

      - name: Notify HA failure
        if: failure()
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "MVN media CDN check failed"
          details: "Artifact: media-cdn-check-log-${{ github.run_id }}"
