name: PostgreSQL PITR Restore Drill

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      required:
        description: "Run the strict physical PITR restore drill"
        type: boolean
        required: false
        default: true
      backup_id:
        description: "Optional canonical PITR basebackup id"
        type: string
        required: false
        default: ""
      target_time:
        description: "Optional canonical UTC target (YYYY-MM-DDTHH:MM:SSZ)"
        type: string
        required: false
        default: ""
      require_wal:
        description: "Require a complete archived WAL chain (must stay enabled)"
        type: boolean
        required: false
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PITR_RESTORE_DRILL_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.required) || vars.POSTGRES_PITR_REQUIRED || 'false' }}
  PITR_RESTORE_BACKUP_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_id || '' }}
  PITR_RESTORE_TARGET_TIME: ${{ github.event_name == 'workflow_dispatch' && inputs.target_time || '' }}
  PITR_RESTORE_REQUIRE_WAL: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.require_wal) || 'true' }}

jobs:
  pitr-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Require Reviewed Main Ref
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Secret-bearing PITR workflows run only from refs/heads/main"
            exit 64
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Decide Whether To Run
        id: gate
        run: |
          set -euo pipefail
          case "${PITR_RESTORE_DRILL_REQUIRED}" in
            true)
              if [ "${PITR_RESTORE_REQUIRE_WAL}" != "true" ]; then
                echo "::error::Strict PITR restore drills cannot disable the WAL-chain proof"
                exit 64
              fi
              echo "run=true" >> "${GITHUB_OUTPUT}"
              ;;
            false)
              echo "run=false" >> "${GITHUB_OUTPUT}"
              printf '%s\n' "PITR restore drill skipped because POSTGRES_PITR_REQUIRED is false." \
                | tee postgres-pitr-restore-drill.log
              ;;
            *)
              echo "::error::POSTGRES_PITR_REQUIRED must be exactly true or false"
              exit 64
              ;;
          esac

      - name: Run PostgreSQL PITR Restore Drill
        if: steps.gate.outputs.run == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SSH_KEY}" ]; then
            echo "::error::Missing required SSH_KEY secret"
            exit 1
          fi
          ssh_identity="${SSH_KEY}"
          unset SSH_KEY
          trap 'ssh_identity=' EXIT
          args=(--phase restore-drill)
          if [ -n "${PITR_RESTORE_BACKUP_ID}" ]; then
            args+=(--backup-id "${PITR_RESTORE_BACKUP_ID}")
          fi
          if [ -n "${PITR_RESTORE_TARGET_TIME}" ]; then
            args+=(--target-time "${PITR_RESTORE_TARGET_TIME}")
          fi
          printf '%s\n' "${ssh_identity}" \
            | python3 -I scripts/ha/run_postgres_pitr_workflow.py "${args[@]}" 2>&1 \
            | tee postgres-pitr-restore-drill.log

      - name: Write Summary
        if: always()
        run: |
          {
            echo "## PostgreSQL PITR Restore Drill"
            echo "- strict_required: ${PITR_RESTORE_DRILL_REQUIRED}"
            echo "- ran: ${{ steps.gate.outputs.run || 'false' }}"
            echo "- topology: pinned mvn-api + zakup Patroni cluster"
            echo "- backup_selector: ${{ env.PITR_RESTORE_BACKUP_ID != '' && 'explicit canonical id' || 'latest valid backup' }}"
            echo "- recovery_target: ${{ env.PITR_RESTORE_TARGET_TIME != '' && 'explicit canonical UTC' || 'server-generated restore point' }}"
            echo "- require_wal: true"
            echo "- log_artifact: postgres-pitr-restore-drill-log-${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload PITR Restore Drill Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-pitr-restore-drill-log-${{ github.run_id }}
          path: postgres-pitr-restore-drill.log
          if-no-files-found: warn

      - name: Notify HA failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/notify-ha-failure
        with:
          bot-token: ${{ secrets.HA_ALERT_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.HA_ALERT_TELEGRAM_CHAT_ID }}
          thread-id: ${{ secrets.HA_ALERT_TELEGRAM_THREAD_ID }}
          title: "MVN PostgreSQL PITR restore drill failed"
          details: "Artifact: postgres-pitr-restore-drill-log-${{ github.run_id }}"
