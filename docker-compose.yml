version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepass}
      POSTGRES_DB: ${POSTGRES_DB:-air_conditioners}
    ports:
      - "5432:5432"
    volumes:

      - postgres_data:/var/lib/postgresql/data

  db_test:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepass}
      POSTGRES_DB: air_conditioners_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_started
      gotenberg:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mvnadmin}:${POSTGRES_PASSWORD:-securepass}@db/${POSTGRES_DB:-air_conditioners}
      SCHEDULER_ENABLED: "false"
      DOCUMENT_PDF_CONVERTER_URL: http://gotenberg:3000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice@sha256:3c23aeb3a027a63d7c71745fc9d83724bd58cf9dfa470396ac82c0896028db2a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  bot:
    build: .
    restart: always
    depends_on:
      - app
    # Keep the bot runtime on an explicit allowlist. Compose still reads .env
    # for interpolation, but backend/database credentials never enter the
    # container environment.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_API_TOKEN: ${BOT_API_TOKEN:?set BOT_API_TOKEN in .env}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:-http://app:8000/api/internal/bot/v1}
      BOT_API_TIMEOUT_SECONDS: ${BOT_API_TIMEOUT_SECONDS:-5}
      BOT_ENABLED: ${BOT_ENABLED:-true}
      BOT_DROP_PENDING_UPDATES: ${BOT_DROP_PENDING_UPDATES:-false}
      APP_ROLE: ${APP_ROLE:-primary}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://mvn.by}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://mvn.by/api/v1}
      MANAGER_BASE_URL: ${MANAGER_BASE_URL:-}
      BOT_RUNTIME_LEASE_SECONDS: ${BOT_RUNTIME_LEASE_SECONDS:-45}
      BOT_RUNTIME_RENEW_SECONDS: ${BOT_RUNTIME_RENEW_SECONDS:-15}
      BOT_RUNTIME_RETRY_SECONDS: ${BOT_RUNTIME_RETRY_SECONDS:-5}
    # ВАЖНО: Переопределяем команду запуска.
    # Вместо uvicorn (как в Dockerfile) запускаем бота
    command: python -m bot_app.main

volumes:
  postgres_data:
  postgres_data_test:
