# Origin-only protected host route for the production shadow Astro runtime.
# Install as a separate nginx site. Do not include this in the public mvn.by
# static server block and do not point apex/root traffic at this runtime.
#
# Basic auth setup:
#   apt-get install -y apache2-utils
#   htpasswd -c /etc/nginx/.htpasswd-web-shadow <user>
#
# Smoke before any DNS change:
#   curl -I -H 'Host: shadow-web.mvn.by' -u '<user>:<password>' http://127.0.0.1/
#
# If a real shadow hostname is later approved, issue/attach TLS for that
# hostname before adding a 443 server. Keep basic auth and noindex/no-store.

server {
    listen 80;
    server_name shadow-web.mvn.by;

    access_log /var/log/nginx/mvn-web-shadow.access.log;
    error_log /var/log/nginx/mvn-web-shadow.error.log;

    auth_basic "mvn.by web shadow";
    auth_basic_user_file /etc/nginx/.htpasswd-web-shadow;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
