version: '3.9'

x-api-app: &api-app
  image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
  restart: always
  depends_on:
    - db
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
  volumes:
    - ./media:/app/media
    - ./model-cache/u2net:/root/.u2net
    - ./token.json:/app/token.json
    - ./client_secret.json:/app/client_secret.json
    - ./credentials.json:/app/credentials.json
    - ./g-vision-ocr.json:/app/g-vision-ocr.json:ro

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    <<: *api-app
    ports:
      - "127.0.0.1:8000:8000"

  app-blue:
    <<: *api-app
    restart: unless-stopped
    profiles: [bluegreen]
    ports:
      - "127.0.0.1:18001:8000"

  app-green:
    <<: *api-app
    restart: unless-stopped
    profiles: [bluegreen]
    ports:
      - "127.0.0.1:18002:8000"

  bot:
    image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    volumes:
      - ./media:/app/media
      - ./g-vision-ocr.json:/app/g-vision-ocr.json:ro
    command: python -m bot_app.main

volumes:
  postgres_data:
