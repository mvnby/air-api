version: '3.9'

x-api-app: &api-app
  image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
  restart: always
  depends_on:
    db:
      condition: service_started
    gotenberg:
      condition: service_healthy
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    ENVIRONMENT: production
    GOOGLE_OAUTH_REDIRECT_URI: https://api.mvn.by/api/manager/google-auth/callback
    GOOGLE_TOKEN_FILE: /app/google-oauth/token.json
    GOOGLE_VISION_CREDENTIALS_FILE: /app/g-vision-ocr.json
    SERVICE_ATTACHMENT_STORAGE_PROVIDER: r2
    DOCUMENT_PDF_CONVERTER_URL: http://gotenberg:3000
  volumes:
    - ./media:/app/media
    - ./model-cache/u2net:/root/.u2net
    - ./google-oauth:/app/google-oauth
    - ./client_secret.json:/app/client_secret.json:ro
    - ./credentials.json:/app/credentials.json:ro
    - ./g-vision-ocr.json:/app/g-vision-ocr.json:ro

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice@sha256:3c23aeb3a027a63d7c71745fc9d83724bd58cf9dfa470396ac82c0896028db2a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MVN_DOCUMENT_PDF_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  app:
    <<: *api-app
    ports:
      - "127.0.0.1:8000:8000"

  app-blue:
    <<: *api-app
    restart: unless-stopped
    profiles: [bluegreen]
    ports:
      - "127.0.0.1:18001:8000"

  app-green:
    <<: *api-app
    restart: unless-stopped
    profiles: [bluegreen]
    ports:
      - "127.0.0.1:18002:8000"

  bot:
    profiles: [legacy-bot]
    image: ${BACKEND_IMAGE:?set immutable BACKEND_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_API_TOKEN: ${BOT_API_TOKEN:?set BOT_API_TOKEN in .env}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:?set stable HTTPS BOT_API_BASE_URL in .env}
      BOT_API_TIMEOUT_SECONDS: ${BOT_API_TIMEOUT_SECONDS:-5}
      BOT_ENABLED: ${LEGACY_BOT_ENABLED:-false}
      BOT_DROP_PENDING_UPDATES: ${BOT_DROP_PENDING_UPDATES:-false}
      APP_ROLE: ${APP_ROLE:-primary}
      ENVIRONMENT: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://mvn.by}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://mvn.by/api/v1}
      MANAGER_BASE_URL: ${MANAGER_BASE_URL:-}
      BOT_RUNTIME_LEASE_SECONDS: ${BOT_RUNTIME_LEASE_SECONDS:-45}
      BOT_RUNTIME_RENEW_SECONDS: ${BOT_RUNTIME_RENEW_SECONDS:-15}
      BOT_RUNTIME_RETRY_SECONDS: ${BOT_RUNTIME_RETRY_SECONDS:-5}
    command: python -m bot_app.main

volumes:
  postgres_data:
